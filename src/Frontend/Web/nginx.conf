server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;
  charset utf-8;
  location = /web { return 308 /web/; }
  location = /web/ { add_header Cache-Control "no-store"; try_files /web/index.html =404; }
  location ~ "^/web/assets/.+-[A-Za-z0-9_-]{8,}\.(js|css|svg|png|woff2)$" { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location /web/assets/ { try_files $uri =404; }
  location ~* ^/web/.*\.(?:js|css|json|map|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf)$ { try_files $uri =404; }
  location /web/ { add_header Cache-Control "no-store"; try_files $uri $uri/ /web/index.html; }
  location / { return 404; }
}
