name: efcore-wolverine-sample
services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ef_inventory_sample
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: ${SAMPLE_POSTGRES_PASSWORD:?Set SAMPLE_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sample -d ef_inventory_sample"]
      interval: 2s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "127.0.0.1:39092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://127.0.0.1:39092,INTERNAL://kafka:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
