openapi: 3.0.3
info:
  title: Supplier API
  version: 1.0.0
  description: External supplier sandbox contract. Import this file into Microcks using the Quick Import UI.
servers:
  - url: http://localhost:8184/rest/Supplier+API/1.0.0
paths:
  /supplier/catalog/{sku}:
    get:
      operationId: getSupplierCatalogQuote
      parameters:
        - name: sku
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Supplier quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
              examples:
                MOCK-001:
                  value: { sku: MOCK-001, name: Microcks fixture product, unitPrice: 100.00, currency: TWD, origin: microcks }
        '404': { description: Unknown supplier SKU }
  /supplier/orders:
    post:
      operationId: submitSupplierOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderRequest' }
            examples:
              mock-order:
                value: { clientRequestId: 9d4c99da-6517-46b2-baa7-7e81106d3d34, sku: MOCK-001, quantity: 2, unitPrice: 100.00, currency: TWD }
      responses:
        '200':
          description: Supplier order result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
              examples:
                mock-order:
                  value: { supplierOrderId: 00000000-0000-4000-8000-000000000017, clientRequestId: 9d4c99da-6517-46b2-baa7-7e81106d3d34, sku: MOCK-001, quantity: 2, unitPrice: 100.00, currency: TWD, status: accepted, origin: microcks }
        '409': { description: Idempotency conflict }
  /supplier/orders/by-client-request/{clientRequestId}:
    get:
      operationId: reconcileSupplierOrder
      parameters:
        - name: clientRequestId
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: 9d4c99da-6517-46b2-baa7-7e81106d3d34
      responses:
        '200':
          description: Reconciled supplier order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
              examples:
                9d4c99da-6517-46b2-baa7-7e81106d3d34:
                  value: { supplierOrderId: 00000000-0000-4000-8000-000000000017, clientRequestId: 9d4c99da-6517-46b2-baa7-7e81106d3d34, sku: MOCK-001, quantity: 2, unitPrice: 100.00, currency: TWD, status: accepted, origin: microcks }
        '404': { description: Order not found }
components:
  schemas:
    Quote:
      type: object
      required: [sku, name, unitPrice, currency, origin]
      properties:
        sku: { type: string }
        name: { type: string }
        unitPrice: { type: number, format: double }
        currency: { type: string, enum: [TWD] }
        origin: { type: string, enum: [sandbox, microcks] }
    OrderRequest:
      type: object
      required: [clientRequestId, sku, quantity, unitPrice, currency]
      properties:
        clientRequestId: { type: string, format: uuid }
        sku: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: number, minimum: 0 }
        currency: { type: string, enum: [TWD] }
    Order:
      allOf:
        - $ref: '#/components/schemas/OrderRequest'
        - type: object
          required: [supplierOrderId, status, origin]
          properties:
            supplierOrderId: { type: string }
            status: { type: string, enum: [accepted, rejected] }
            origin: { type: string, enum: [sandbox, microcks] }
