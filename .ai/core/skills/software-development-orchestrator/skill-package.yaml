  "configuration": {
    "namespace": "software-development-orchestrator",
    "defaults": {
      "store": {
        "kind": "filesystem",
        "root": "notes/workflows",
        "tracking": "tracked"
      },
      "template": {
        "origin": "package",
        "path": "templates/workflow.md"
      }
    }
  },
  "artifact_roles": [
    {
      "role": "software-development-orchestrator.record",
      "owner": "project",
      "schema": "software-development-orchestrator.record@1.0.0",
      "read_schemas": [
        "software-development-orchestrator.record@1.0.0"
      ],
      "store_binding": "software-development-orchestrator.store",
      "identity": "wf-<32 lowercase hex digits>",
      "filename": "<id>.workflow.json",
      "read_operations": [
        "inspect",
        "query",
        "resume",
        "render",
        "retention-preview"
      ],
      "write_operations": [
        "create",
        "checkpoint",
        "transition",
        "retrospect"
      ]
    },
    {
      "role": "software-development-orchestrator.view",
      "owner": "derived",
      "source_role": "software-development-orchestrator.record",
      "output": "result-only Markdown",
      "persistence": "Caller-selected export is a separate write",
      "produce_operations": [
        "render"
      ]
    }
  ],
  "resources": {
    "references": [
      "references/configuration.md",
