content_kind: reference-only-technical-guidance
title: Code Review Guidance
activation: none; consuming this member does not dispatch a worker or authorize execution
applicability: Use only with the target-selected architecture, technology and applicable registered rules; this historical
  guidance is not a separate normative owner.
inputs:
- reviewed files or bounded scope
- selected review route IDs and their canonical references
- optional test results or validation output
outputs:
- review findings with file and line references
- must-fix and should-fix categories
- positive findings and follow-up notes
technical_guidance:
- Do not redefine target architecture
- Do not silently approve code without comparing behavior, contracts and evidence
- Remain read-only and report specialist coverage that was unavailable or not performed
- Do not impose unselected architecture or technology conventions
- Always separate findings from summary
- Do not load unselected file-type standards or broad shared review summaries
references:
- references/review-playbook.md
- references/review-prompt.md
- target-authority:ai-assets-skills-code-reviewer-references-review-routing.yaml
- target-authority:ai-assets-skills-code-reviewer-skill.yaml
examples:
- references/review-playbook.md
- references/review-prompt.md
