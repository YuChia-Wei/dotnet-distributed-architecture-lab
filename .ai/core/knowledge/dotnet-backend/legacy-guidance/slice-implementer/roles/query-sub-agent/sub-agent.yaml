content_kind: reference-only-technical-guidance
title: Query Guidance
activation: none; consuming this member does not dispatch a worker or authorize execution
applicability: Use only with the target-selected architecture, technology and applicable registered rules; this historical
  guidance is not a separate normative owner.
inputs:
- query behavior goal
- projection or DTO expectations
- client-facing state or filter requirements
outputs:
- query implementation guidance
- read-side storage and DTO rules
- follow-up validation notes
technical_guidance:
- Queries must not modify domain state
- Use read models or projections for query paths
- Return DTOs, never domain entities
- Use an explicit query Use Case by default; direct Query Repository/Service access is only for an explicitly selected pure-query
  endpoint
references:
- references/implementation-playbook.md
- ../../../../shared/common-rules.md
- ../../../../shared/domain-rules.md
examples:
