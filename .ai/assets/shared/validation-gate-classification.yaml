      - "orchestrator-capability-contract"
      - "package-apply"
      - "payload-user-view"
      - "profile-projection"
      - "profile-registry-contract"
      - "provider-role-package-projection"
      - "python-source-entrypoints"
      - "release-asset-identity"
      - "release-notes-renderer"
      - "release-preparation-tests"
      - "release-state-tests"
      - "repository-config-contract"
      - "repository-config-contract-tests"
      - "repository-identity-tests"
      - "sdk-free-framework-contract"
      - "semantic-customization-lifecycle"
      - "semantic-customization-skill-contract"
      - "shell-assets"
      - "skill-retirement-tests"
      - "skill-script-colocation"
      - "skill-transition"
      - "skill-transition-tests"
      - "source-ai-context-version"
      - "source-governance-manifest"
      - "source-version-governance-tests"
