      - "validation-evidence-contract"
      - "validation-lifecycle-contract"
      - "validation-lifecycle-tests"
      - "validation-process-supervisor-contract"
      - "workflow-artifacts"
      - "workflow-handoff"
      - "workflow-handoff-checkpoints"
      - "workflow-implementation-contract"
      - "workflow-lifecycle-contract"
    reason: "The complete governed subject is not yet approved for reuse; the current cache policy remains unchanged."
  - group_id: "fingerprint-candidates"
    sensitivities: [input, environment]
    reuse_eligibility: "candidate-disabled"
    reusable_profiles: []
    environment_contract: "baseline-runtime-platform/v1"
    gate_ids:
      - "package-full-matrix"
      - "package-smoke"
    reason: "Existing package fingerprints are useful but do not yet prove the complete governed subject."
  - group_id: "identity-range-fresh"
    sensitivities: [identity, input]
    reuse_eligibility: "not-reusable"
    reusable_profiles: []
    environment_contract: null
    gate_ids:
      - "selected-git-commits"
    reason: "The accepted behavior is explicitly bound to the current commit range."
  - group_id: "validation-control-fresh"
    sensitivities: [input, environment]
    reuse_eligibility: "not-reusable"
    reusable_profiles: []
    environment_contract: "baseline-runtime-platform/v1"
    gate_ids:
      - "aggregate-runner-contract"
      - "validation-evidence-exhaustive-contract"
    reason: "The aggregate runner and exhaustive evidence mechanisms must exercise the reuse control surface itself."
  - group_id: "unproven-local-fresh"
    sensitivities: [input, environment]
    reuse_eligibility: "not-reusable"
    reusable_profiles: []
    environment_contract: "baseline-runtime-platform/v1"
    gate_ids:
      - "adr-index-update"
      - "spec-implementation"
      - "template-synchronization"
      - "test-di-compliance"
    reason: "No complete target-owned or advisory-gate manifest is approved."
  - group_id: "provider-closeout-fresh"
    sensitivities: [identity, input, provider]
    reuse_eligibility: "not-reusable"
    reusable_profiles: []
    environment_contract: null
    gate_ids:
      - "source-release-closeout-contract"
    reason: "Local contract tests cannot replace live historical and provider verification."
external_fresh_gates:
  - gate_id: "actual-upgrade-evidence"
    sensitivities: [identity, input, environment]
    reason: "Actual Windows and Linux upgrade execution remains fresh until separately classified and approved."
  - gate_id: "current-head-review-binding"
    sensitivities: [input, provider]
    reason: "Admission recomputes the current base/head content subject and binds an authenticated independent review without requiring commit-SHA equality."
  - gate_id: "hosted-required-contexts"
    sensitivities: [identity, environment, provider]
    reason: "Every required hosted context must be present and terminal on the admitted head."
  - gate_id: "live-merge-admission"
    sensitivities: [identity, provider]
    reason: "Mergeability, reviews, base, head, and body require live provider read-back."
  - gate_id: "mutable-provider-state"
    sensitivities: [provider]
    reason: "Issue, Project, and other mutable provider state is never replaced by a local receipt."
  - gate_id: "tag-release-binding"
    sensitivities: [identity, provider]
    reason: "Tag and Release identities require fresh immutable and provider binding."
