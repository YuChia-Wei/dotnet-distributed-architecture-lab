    sensitivities: [input, environment]
    reuse_eligibility: "pilot-approved"
    reusable_profiles: [fast, pr]
    environment_contract: "multi-hop-upgrade-environment/v1"
    gate_ids:
      - "multi-hop-upgrade-transaction"
    reason: "The owner approved one deterministic 360-second pilot after Issues 267 and 268 completed."
  - group_id: "input-environment-candidates"
    sensitivities: [input, environment]
    reuse_eligibility: "candidate-disabled"
    reusable_profiles: []
    environment_contract: "baseline-runtime-platform/v1"
    gate_ids:
      - "agent-execution-guardrails-contract"
