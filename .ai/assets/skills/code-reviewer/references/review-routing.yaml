asset_id: "code-reviewer-review-routing"
schema_version: "2.0"
asset_type: "review-routing-contract"
title: "Technology-Neutral Code Review Routing"
source_of_truth: "canonical"
status: "active"

selection:
  core_route: "common"
  order:
    - "explicit review scope, intended behavior and target-owned decisions"
    - "target-selected components and technology profiles"
    - "per-file technology evidence from manifests, imports and type hierarchy"
    - "applicable installed extension routes, plus the common route"
  multi_file_scope: "Partition by technology; apply the common route to every partition and only the matching extensions to each."
  conflict_outcome: "Report conflicting selection evidence and stop the affected specialist review until resolved; do not silently choose a technology or architecture."
  unresolved_outcome: "Perform bounded common review when its inputs are sufficient and report missing specialist coverage; block acceptance if the target requires that coverage."
  component_selection: "Use explicit target selection or installed component evidence; a file suffix alone does not install or activate an extension."
  effective_rule_preflight: "Consume every applicable freshness-verified target-effective or explicitly selected source rule packet before judging against catalog rules. Missing or stale authority stops those checks; the common route is not a fallback for a failed packet."

routes:
  - route_id: "common"
    priority: 0
    selectors:
      path_globs: ["*", "**/*"]
      type_signals: []
    canonical_references:
      - ".ai/assets/skills/code-reviewer/references/core-review-playbook.md"
    finding_rules: []

extensions:
  - extension_id: "dotnet-backend"
    component_id: "dotnet-backend"
    contract_path_template: ".ai/assets/tech-stacks/<profile>/review/review-routing.yaml"
    resolution: "Substitute the explicitly selected component_id for <profile>; verify the installed contract component_id matches before loading. Do not scan or activate unselected profiles."
    load_when: "The dotnet-backend component is selected and installed, and the reviewed partition is .NET backend code or its implementation guidance."
    unavailable_outcome: "Report that .NET specialist checks were not performed; preserve any target-required specialist gate."
  # Target-owned extensions may add other technologies through their explicit
  # authority and applicability contracts. This release ships only this extension.

architecture_selection:
  authority: "target-owned requirements, architecture decisions and effective rules"
  rule: "Apply DDD, Clean Architecture, CQRS or Event Sourcing only when adopted for the reviewed scope. Distinguish a chosen design method from a language or framework."

phase_references:
  role_execution:
    load_when: "The common route, selected extensions and applicable role bindings have been identified."
    references:
      - ".ai/assets/skills/code-reviewer/references/role-execution.md"
  output:
    load_when: "Findings are ready to format or persistence mode must be selected."
    references:
      - ".ai/assets/skills/code-reviewer/references/output-contract.md"

loading_contract:
  - "Read this common routing contract first. Load the common playbook for every review."
  - "Load extension contracts and their standards only when their load_when condition holds."
  - "Apply target-owned rules within their stated scope and authority; report unresolved conflicts."
  - "Do not interpret a missing extension as a clean specialist review."
  - "Do not load compatibility summaries as additional semantic owners."
  - "Load phase references at their declared phase and de-duplicate selected references."
