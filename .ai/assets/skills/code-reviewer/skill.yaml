asset_id: code-reviewer
schema_version: '1.0'
asset_type: skill-spec
title: Code Reviewer
purpose: Review code and implementation guidance through a technology-neutral reasoning core, selected technology extensions and target-owned rules. Return evidence-backed findings without implementing fixes or defining target architecture.
portability: repo-portable
component_availability:
  component_id: software-development-core
  core_only: available
  dotnet_selected: available
audience: agent-facing
source_of_truth: canonical
capability_slots:
- review
triggers:
- code review
- review code
- check this file
inputs:
- target file or reviewed scope
- intended behavior, target-owned rules and selected components or technology evidence
- common route and applicable extension routes selected from the canonical review-routing contract
outputs:
- transient conversational review or standalone durable assessment
- architecture-level findings
- code-level findings
- review coverage, selected extensions, limitations and optional target-requested scores
- one provider-neutral role_execution record for every considered review-role binding, handed to the orchestrator without transferring review ownership
constraints:
- Do not define target architecture
- Do not output a staged refactoring plan
- Preserve software engineering reasoning even when analyzer or test output is available
- Use tests, analyzers and searches as evidence, not a replacement for review reasoning
- Do not apply unselected architecture methods or technology conventions
- Report missing specialist coverage and preserve target-required review gates
- Keep review read-only; route remediation to software-development-orchestrator or the appropriate implementer
- Pin durable assessments to the reviewed Git revision and use ASM-YYYYMMDD-HH-xxx#CR-NNN finding references
- Load only the canonical standards selected by the file-type and finding route
- Do not treat compatibility indexes, shared summaries, or role prompts as semantic owners
role_bindings:
- role_path: .ai/assets/sub-agent-role-prompts/code-review-sub-agent/sub-agent.yaml
  role_asset_id: code-review-sub-agent
  expected_role_status: active
  binding_kind: primary
  applicability: A bounded code or implementation-guidance review scope is selected, regardless of technology.
  load_obligation: mandatory-when-applicable
- role_path: .ai/assets/sub-agent-role-prompts/aggregate-code-review-sub-agent/sub-agent.yaml
  role_asset_id: aggregate-code-review-sub-agent
  expected_role_status: active
  binding_kind: conditional
  applicability: The target adopts aggregate or event-sourcing concepts for the selected scope, or domain-invariant behavior needs bounded review.
  load_obligation: mandatory-when-applicable
- role_path: .ai/assets/sub-agent-role-prompts/controller-code-review-sub-agent/sub-agent.yaml
  role_asset_id: controller-code-review-sub-agent
  expected_role_status: active
  binding_kind: conditional
  applicability: The selected scope includes an HTTP controller, endpoint, transport-data boundary or HTTP contract.
  load_obligation: mandatory-when-applicable
- role_path: .ai/assets/sub-agent-role-prompts/reactor-code-review-sub-agent/sub-agent.yaml
  role_asset_id: reactor-code-review-sub-agent
  expected_role_status: active
  binding_kind: conditional
  applicability: The selected scope includes event handling, handler registration or adopted cross-aggregate integration boundaries.
  load_obligation: mandatory-when-applicable
workflow:
- step: 1
  description: Identify subject, intent and target authority; read review-routing.yaml, select the common route and matching installed extensions, and complete every applicable effective-rule preflight
- step: 2
  description: Load the common playbook plus selected extension and target rules; evaluate role applicability, de-duplicate references and record the review coverage
- step: 3
  description: Execute bounded review directly or through eligible delegation, tracing behavior, failures, compatibility and test evidence; separate findings from uncertainty and coverage gaps
- step: 4
  description: After findings exist, load the output phase reference, return transient findings or persist an explicitly requested assessment, and hand role_execution records to the orchestrator for aggregation
references:
- .ai/assets/skills/code-reviewer/references/review-routing.yaml
templates:
- .ai/assets/skills/code-reviewer/templates/code-review-assessment-report-template.md
examples:
- .dev/guides/ai-collaboration-guides/AI-REFACTORING-SKILL-BOUNDARY-GUIDE.md
human_guide: .dev/guides/ai-collaboration-guides/AI-REFACTORING-SKILL-BOUNDARY-GUIDE.md
wrapper_targets:
- claude
- codex
wrapper_metadata:
  claude:
    wrapper_path: .claude/skills/code-reviewer/
  codex:
    wrapper_path: .agents/skills/code-reviewer/
status: active
effective_rule_consumption:
  applies_when:
  - The skill reviews code or implementation guidance against applicable adopted engineering catalog rules, including selected technology extensions.
  excludes:
  - Architecture design, remediation implementation, or an assessment locator operation that does not perform review analysis. Common reasoning against supplied behavior does not claim verification of unresolved catalog rules.
  resolver: .ai/scripts/resolve-effective-rule-packet.py
  applicability:
    selector: applicability_mode
    modes:
      initialized-target:
        authority: .dev/ai-context/provenance.yaml
        rule_selection: exact target effective-state route
        downstream_provenance: required
  selectors:
  - capability
  - execution_mode
  - technology_profile
  - file_type
  unresolved_outcome: stop-applicable-action
  consumption_order: Select the applicability mode explicitly, then consume its freshness-verified task-scoped evidence before reading profile references needed for the applicable action.
  evidence:
    required_common:
    - resolver_outcome
    - applicability_mode
    - loaded_rule_ids
    - request.capability
    - request.execution_mode
    - request.technology_profile
    - request.file_type
    - rules[].normative_statement_digest
    - packet_digest
    required_by_mode:
      initialized-target:
      - baseline.framework_version
      - target_state.digest
  semantic_consistency:
    identity: rule_id
    statement_bytes: exact UTF-8 rules[].normative_statement bytes
    statement_digest: rules[].normative_statement_digest
    cross_consumer_requirement: the same rule_id must resolve to byte-equivalent effective semantics across consumers
    default_mismatch_outcome: warning
    stricter_policy_owner: target-owned in initialized-target mode
  prohibitions:
  - Do not infer applicability mode from repository contents, remembered state, or missing downstream provenance.
  - Do not scan broad target or framework documents to discover rule semantics.
  - Do not fall back to framework defaults.
  - Do not select an alternate route when the exact request route is unresolved.
  - Do not compare analyzer output as effective-rule semantics.
  - Keep analyzer severity and warnings-as-errors separate and target-owned.
