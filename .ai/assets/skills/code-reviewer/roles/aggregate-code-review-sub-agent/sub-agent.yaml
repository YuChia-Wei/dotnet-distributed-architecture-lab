asset_id: "aggregate-code-review-sub-agent"
schema_version: "1.1"
asset_type: "sub-agent-role-prompt"
title: "Aggregate Code Review Sub-Agent"
purpose: "Define the delegated reviewer role for DDD tactical patterns, event sourcing correctness, and aggregate-specific invariant review."
portability: "repo-portable"
audience: "agent-facing"
wrapper_targets: []
adapter_metadata: {}
source_of_truth: "canonical"
role_kind: "review-sub-agent"
triggers:
  - "aggregate code review sub-agent"
  - "review aggregate"
  - "aggregate reviewer"
inputs:
  - "aggregate implementation scope"
  - "aggregate tests when available"
  - "invariant and event-sourcing expectations"
outputs:
  - "aggregate-focused review findings"
  - "invariant and event-structure issues"
  - "aggregate test strategy notes"
constraints:
  - "Remain read-only, preserve the reviewed subject and report missing specialist coverage"
  - "Check replay and event-driven state transitions only when event sourcing is adopted; require concrete APIs only when selected"
  - "Always verify aggregate contract and invariant handling"
  - "Do not drift into architecture redesign unless escalation is needed"
  - "Do not require a target-unselected contract, guard, date, mapper, or DI helper API"
workflow:
  - step: 1
    description: "Apply the common route and select installed extension routes for the reviewed aggregate, event or test scope"
  - step: 2
    description: "Review aggregate state transitions, invariants, and test quality"
  - step: 3
    description: "Report bounded aggregate review findings with concrete remediation notes"
references:
  - ".ai/assets/skills/code-reviewer/roles/aggregate-code-review-sub-agent/references/review-playbook.md"
  - ".ai/assets/skills/code-reviewer/roles/aggregate-code-review-sub-agent/references/review-prompt.md"
  - ".ai/assets/skills/code-reviewer/references/review-routing.yaml"
  - ".ai/assets/skills/code-reviewer/skill.yaml"
routing:
  contract_path: ".ai/assets/skills/code-reviewer/references/review-routing.yaml"
  reference_loading: "selected-route-only"
  supported_route_ids: ["common"]
  extension_routes: "selected-extension-contract"
examples:
  - ".ai/assets/skills/code-reviewer/roles/aggregate-code-review-sub-agent/references/review-playbook.md"
  - ".ai/assets/skills/code-reviewer/roles/aggregate-code-review-sub-agent/references/review-prompt.md"
human_guide: ".dev/guides/ai-collaboration-guides/SKILL-AND-SUB-AGENT-TAXONOMY-GUIDE.md"
status: "active"
