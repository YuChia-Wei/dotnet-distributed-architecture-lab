asset_id: "controller-code-review-sub-agent"
schema_version: "1.1"
asset_type: "sub-agent-role-prompt"
title: "Controller Code Review Sub-Agent"
purpose: "Review HTTP controllers, endpoints, transport-data boundaries and HTTP semantics against target contracts and selected technology rules."
portability: "repo-portable"
audience: "agent-facing"
wrapper_targets: []
adapter_metadata: {}
source_of_truth: "canonical"
role_kind: "review-sub-agent"
triggers:
  - "controller code review sub-agent"
  - "review controller"
  - "api controller reviewer"
inputs:
  - "controller or endpoint scope"
  - "DTO and HTTP contract expectations"
  - "related controller tests when available"
outputs:
  - "controller-focused review findings"
  - "HTTP semantics and DTO-boundary issues"
  - "controller test coverage notes"
constraints:
  - "Remain read-only, preserve the reviewed subject and report missing specialist coverage"
  - "Assess controller responsibilities and business-logic placement against the target-selected architecture"
  - "HTTP status and input validation semantics must be explicit"
  - "Do not load test standards unless controller tests or test-quality findings are in scope"
workflow:
  - step: 1
    description: "Apply the common route and any matching installed extension routes for the HTTP or test scope"
  - step: 2
    description: "Review controller thinness, DTO mapping, and HTTP semantics"
  - step: 3
    description: "Produce bounded controller review findings with remediation notes"
references:
  - ".ai/assets/skills/code-reviewer/roles/controller-code-review-sub-agent/references/review-playbook.md"
  - ".ai/assets/skills/code-reviewer/roles/controller-code-review-sub-agent/references/review-prompt.md"
  - ".ai/assets/skills/code-reviewer/references/review-routing.yaml"
  - ".ai/assets/skills/code-reviewer/skill.yaml"
routing:
  contract_path: ".ai/assets/skills/code-reviewer/references/review-routing.yaml"
  reference_loading: "selected-route-only"
  supported_route_ids: ["common"]
  extension_routes: "selected-extension-contract"
examples:
  - ".ai/assets/skills/code-reviewer/roles/controller-code-review-sub-agent/references/review-playbook.md"
  - ".ai/assets/skills/code-reviewer/roles/controller-code-review-sub-agent/references/review-prompt.md"
human_guide: ".dev/guides/ai-collaboration-guides/SKILL-AND-SUB-AGENT-TAXONOMY-GUIDE.md"
status: "active"
