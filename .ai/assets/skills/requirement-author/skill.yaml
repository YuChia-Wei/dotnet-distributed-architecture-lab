schema_version: "1.0"
asset_id: "requirement-author"
asset_type: "skill-spec"
title: "Requirement Author"
purpose: "Draft or normalize repository requirement documents from rough notes, existing requirement files, codebase facts, ADRs, or stakeholder inputs so they match the .dev/requirement structure."
portability: "repo-portable"
audience: "agent-facing"
source_of_truth: "canonical"
capability_slots:
  - "requirements"
triggers:
  - "requirement"
  - "draft requirement"
  - "normalize requirement"
  - "convert notes to requirement"
inputs:
  - "rough notes, requirement drafts, or codebase context"
  - "topic or bounded-context scope"
  - "optional ADR or architecture references"
outputs:
  - "requirement markdown draft"
  - "explicit assumptions and missing information"
  - "recommended output path under .dev/requirement/"
constraints:
  - "Follow .dev/requirement/REQUIREMENT-GUIDE.MD"
  - "Do not silently invent stakeholder-confirmed facts"
  - "Stop at requirement quality; do not jump straight into use-case JSON specs"
workflow:
  - step: 1
    description: "Identify the topic, scope, and source inputs"
  - step: 2
    description: "Structure the requirement into the required sections"
  - step: 3
    description: "Mark assumptions, gaps, and recommended next handoff"
references:
  - ".ai/assets/skills/requirement-author/references/authoring-playbook.md"
  - ".ai/assets/skills/requirement-author/references/output-contract.md"
  - ".ai/assets/skills/requirement-author/references/source-truth-rules.md"
examples:
  - ".dev/guides/ai-collaboration-guides/REQUIREMENT-DESIGNER-PROMPT-GUIDE.md"
human_guide: ".dev/guides/ai-collaboration-guides/REQUIREMENT-DESIGNER-PROMPT-GUIDE.md"
wrapper_targets:
  - "claude"
  - "codex"
wrapper_metadata:
  claude:
    wrapper_path: ".claude/skills/requirement-author/"
  codex:
    wrapper_path: ".agents/skills/requirement-author/"
status: "active"
effective_rule_consumption:
  applies_when:
    - "The skill authors or normalizes a requirement from supplied requirement truth or bounded source material."
  excludes:
    - "Conversation-only clarification, work-item status, or a handoff that does not author or normalize a requirement."
  resolver: ".ai/scripts/resolve-effective-rule-packet.py"
  selectors:
    - "capability"
    - "execution_mode"
    - "technology_profile"
    - "file_type"
  unresolved_outcome: "stop-applicable-action"
  consumption_order: "Consume a freshness-verified task-scoped packet before reading profile references needed for the applicable action."
  evidence:
    required:
      - "resolver_outcome"
      - "loaded_rule_ids"
      - "baseline.framework_version"
      - "target_state.digest"
      - "request.capability"
      - "request.execution_mode"
      - "request.technology_profile"
      - "request.file_type"
  semantic_consistency:
    identity: "rule_id"
    statement_bytes: "exact UTF-8 rules[].normative_statement bytes"
    statement_digest: "rules[].normative_statement_digest"
    cross_consumer_requirement: "the same rule_id must resolve to byte-equivalent effective semantics across consumers"
    default_mismatch_outcome: "warning"
    stricter_policy_owner: "target-owned"
  prohibitions:
    - "Do not scan broad target or framework documents to discover rule semantics."
    - "Do not fall back to framework defaults."
    - "Do not select an alternate route when the exact request route is unresolved."
    - "Do not compare analyzer output as effective-rule semantics."
    - "Keep analyzer severity and warnings-as-errors separate and target-owned."
