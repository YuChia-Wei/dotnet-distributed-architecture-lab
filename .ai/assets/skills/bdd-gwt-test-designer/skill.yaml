asset_id: "bdd-gwt-test-designer"
schema_version: "1.0"
asset_type: "skill-spec"
title: "BDD GWT Test Designer"
purpose: "Design Given-When-Then tests for this repository by turning requirements, specs, acceptance criteria, or observed behavior into BDD/Gherkin-style scenarios and assertion plans without directly implementing test code."
portability: "repo-portable"
audience: "agent-facing"
source_of_truth: "canonical"
capability_slots:
  - "test-design"
triggers:
  - "BDD"
  - "GWT"
  - "Given When Then"
  - "Gherkin"
inputs:
  - "requirements, specs, acceptance criteria, or existing behavior"
  - "target use case or domain behavior"
outputs:
  - "scenario list in Given-When-Then form"
  - "recommended test level for each scenario"
  - "assertion points and setup notes"
  - "recommended test spec storage path under .dev/specs/tests/"
  - "a .feature artifact design when the user provides or explicitly requests one, or when the target profile selects a feature runner"
  - "an explicit test-implementation handoff that preserves the separate authorization and test-execution boundary"
constraints:
  - "Do not implement final test code unless explicitly requested"
  - "Do not change production code"
  - "Default to scenario notes, not .feature files"
  - "Treat BDDfy as the default profile, while preserving mandatory GWT structure when a target team explicitly opts out"
  - "Never replace GWT with Arrange-Act-Assert (3A)"
  - "Do not choose a feature runner or package without an explicit target decision"
  - "Do not create role_execution, authorize concrete test implementation, or report test execution"
workflow:
  - step: 1
    description: "Identify the highest-priority source of truth"
  - step: 2
    description: "Extract behaviors, rules, and edge cases"
  - step: 3
    description: "Draft Given-When-Then scenarios and map them to test intent"
  - step: 4
    description: "Recommend the correct test spec category and output path, then hand implementation to slice-implementer only when separately authorized"
references:
  - ".ai/assets/skills/bdd-gwt-test-designer/references/scope-rules.md"
  - ".ai/assets/skills/bdd-gwt-test-designer/references/scenario-design-playbook.md"
  - ".ai/assets/skills/bdd-gwt-test-designer/references/output-contract.md"
examples:
  - ".dev/guides/ai-collaboration-guides/BDD-GWT-TEST-DESIGNER-SKILL-GUIDE.md"
human_guide: ".dev/guides/ai-collaboration-guides/BDD-GWT-TEST-DESIGNER-SKILL-GUIDE.md"
wrapper_targets:
  - "claude"
  - "codex"
wrapper_metadata:
  claude:
    wrapper_path: ".claude/skills/bdd-gwt-test-designer/"
  codex:
    wrapper_path: ".agents/skills/bdd-gwt-test-designer/"
status: "active"
effective_rule_consumption:
  applies_when:
    - "The skill designs Given-When-Then scenarios, assertion points, or test-spec intent for selected behavior."
  excludes:
    - "Concrete test implementation, test execution, or a handoff that does not design Given-When-Then behavior."
  resolver: ".ai/scripts/resolve-effective-rule-packet.py"
  selectors:
    - "capability"
    - "execution_mode"
    - "technology_profile"
    - "file_type"
  unresolved_outcome: "stop-applicable-action"
  consumption_order: "Consume a freshness-verified task-scoped packet before reading profile references needed for the applicable action."
  evidence:
    required:
      - "resolver_outcome"
      - "loaded_rule_ids"
      - "baseline.framework_version"
      - "target_state.digest"
      - "request.capability"
      - "request.execution_mode"
      - "request.technology_profile"
      - "request.file_type"
  semantic_consistency:
    identity: "rule_id"
    statement_bytes: "exact UTF-8 rules[].normative_statement bytes"
    statement_digest: "rules[].normative_statement_digest"
    cross_consumer_requirement: "the same rule_id must resolve to byte-equivalent effective semantics across consumers"
    default_mismatch_outcome: "warning"
    stricter_policy_owner: "target-owned"
  prohibitions:
    - "Do not scan broad target or framework documents to discover rule semantics."
    - "Do not fall back to framework defaults."
    - "Do not select an alternate route when the exact request route is unresolved."
    - "Do not compare analyzer output as effective-rule semantics."
    - "Keep analyzer severity and warnings-as-errors separate and target-owned."
