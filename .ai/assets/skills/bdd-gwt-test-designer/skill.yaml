asset_id: bdd-gwt-test-designer
schema_version: '1.0'
asset_type: skill-spec
title: BDD GWT Test Designer
purpose: Design or review Given-When-Then scenario artifacts with requirement traceability, observable assertions and target-selected testing conventions, without implementing or executing tests.
portability: repo-portable
audience: agent-facing
source_of_truth: canonical
capability_slots:
- test-design
triggers:
- review BDD scenarios
- BDD
- GWT
- Given When Then
- Gherkin
inputs:
- requested design/review mode and fixed artifact identity for review
- requirements, specs, acceptance criteria, or existing behavior
- target use case or domain behavior
outputs:
- 'in review mode: read-only findings, evidence, impact, uncertainty, coverage and handoff'
- scenario list in Given-When-Then form
- recommended test level for each scenario
- assertion points and setup notes
- recommended test spec storage path under .dev/specs/tests/
- a .feature artifact design when the user provides or explicitly requests one, or when the target profile selects a feature runner
- an explicit test-implementation handoff that preserves the separate authorization and test-execution boundary
constraints:
- Review mode preserves the fixed submitted artifact; authorized revision is a separate design action.
- Distinguish author self-check from evidenced independent review; do not claim specification compliance.
- Do not implement final test code in this skill. If existing user authorization includes concrete test implementation, hand the bounded design and that authorization to slice-implementer without requesting duplicate approval.
- Do not change production code
- Default to scenario notes, not .feature files
- Preserve GWT scenario design; concrete test framework defaults and opt-outs belong to the selected target profile.
- Never replace GWT with Arrange-Act-Assert (3A)
- Do not choose a feature runner or package without an explicit target decision
- Do not create role_execution, authorize concrete test implementation, or report test execution
workflow:
- step: 1
  description: Select design or review, identify source authority and fix the reviewed subject before analysis.
- step: 2
  description: Extract behaviors, rules, and edge cases
- step: 3
  description: In design, draft GWT scenarios mapped to acceptance; in review, assess the fixed scenario artifact using the review criteria.
- step: 4
  description: Recommend the correct test spec category and output path, then hand implementation to slice-implementer only when separately authorized
references:
- .ai/assets/shared/GWT-TEST-HANDOFF-CONTRACT.md
- .ai/assets/shared/ARTIFACT-DESIGN-REVIEW-CONTRACT.md
- .ai/assets/skills/bdd-gwt-test-designer/references/review-criteria.md
- .ai/assets/skills/bdd-gwt-test-designer/references/scope-rules.md
- .ai/assets/skills/bdd-gwt-test-designer/references/scenario-design-playbook.md
- .ai/assets/skills/bdd-gwt-test-designer/references/output-contract.md
examples:
- .dev/guides/ai-collaboration-guides/BDD-GWT-TEST-DESIGNER-SKILL-GUIDE.md
human_guide: .dev/guides/ai-collaboration-guides/BDD-GWT-TEST-DESIGNER-SKILL-GUIDE.md
wrapper_targets:
- claude
- codex
wrapper_metadata:
  claude:
    wrapper_path: .claude/skills/bdd-gwt-test-designer/
  codex:
    wrapper_path: .agents/skills/bdd-gwt-test-designer/
modes:
  design:
    trigger: Create or explicitly revise an artifact.
    artifact_mutation: only-with-existing-user-authorization
  review:
    trigger: Assess an existing fixed artifact.
    artifact_mutation: forbidden
    output: findings-and-handoff
technology_selection:
  contract_path_template: .ai/assets/tech-stacks/<profile>/design/design-routing.yaml
  shipped_extensions:
  - dotnet-backend
  route: test-design
  preflight: Explicit target selection, installed component identity, scope applicability and freshness-verified effective rules are required before loading the selected route.
  unavailable: Report missing specialist coverage and preserve required gates; do not infer a profile from a file suffix.
status: active
effective_rule_consumption:
  applies_when:
  - The skill designs or reviews Given-When-Then scenarios against applicable adopted engineering catalog rules, including selected testing conventions.
  excludes:
  - Common method observations against supplied requirements do not claim verification of unresolved catalog rules or satisfy a required technology gate.
  - Concrete test implementation, test execution, or a handoff that does not design Given-When-Then behavior.
  resolver: .ai/scripts/resolve-effective-rule-packet.py
  applicability:
    selector: applicability_mode
    modes:
      initialized-target:
        authority: .dev/ai-context/provenance.yaml
        rule_selection: exact target effective-state route
        downstream_provenance: required
  selectors:
  - capability
  - execution_mode
  - technology_profile
  - file_type
  unresolved_outcome: stop-applicable-action
  consumption_order: Select the applicability mode explicitly, then consume its freshness-verified task-scoped evidence before reading profile references needed for the applicable action.
  evidence:
    required_common:
    - resolver_outcome
    - applicability_mode
    - loaded_rule_ids
    - request.capability
    - request.execution_mode
    - request.technology_profile
    - request.file_type
    - rules[].normative_statement_digest
    - packet_digest
    required_by_mode:
      initialized-target:
      - baseline.framework_version
      - target_state.digest
  semantic_consistency:
    identity: rule_id
    statement_bytes: exact UTF-8 rules[].normative_statement bytes
    statement_digest: rules[].normative_statement_digest
    cross_consumer_requirement: the same rule_id must resolve to byte-equivalent effective semantics across consumers
    default_mismatch_outcome: warning
    stricter_policy_owner: target-owned in initialized-target mode
  prohibitions:
  - Do not infer applicability mode from repository contents, remembered state, or missing downstream provenance.
  - Do not scan broad target or framework documents to discover rule semantics.
  - Do not fall back to framework defaults.
  - Do not select an alternate route when the exact request route is unresolved.
  - Do not compare analyzer output as effective-rule semantics.
  - Keep analyzer severity and warnings-as-errors separate and target-owned.
