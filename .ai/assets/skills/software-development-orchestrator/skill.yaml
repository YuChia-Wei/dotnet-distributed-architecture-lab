  test: ".ai/assets/skills/software-development-orchestrator/scripts/tests/test_software_development_orchestrator_acceptance.py"
  activation_fixture: ".ai/assets/skills/software-development-orchestrator/fixtures/acceptance/activation-high-level-pending-approval.yaml"
  activation_expected: ".ai/assets/skills/software-development-orchestrator/fixtures/acceptance/activation-high-level-pending-approval.expected.yaml"
  fresh_session_blueprint: ".ai/assets/skills/software-development-orchestrator/fixtures/acceptance/fresh-session-checkpoint-blueprint.yaml"
workflow_artifacts:
  workflow_kind: "software-development"
  workflow_id_pattern: "YYYY-MM-DD-topic[-NN]"
  artifact_root_default: ".dev/workflows/<workflow-id>"
  locator: ".ai/assets/skills/software-development-orchestrator/templates/workflow-locator-template.yaml"
  plan: ".ai/assets/skills/software-development-orchestrator/templates/development-workflow-plan-template.md"
  task: ".ai/assets/skills/software-development-orchestrator/templates/development-workflow-task-template.json"
  review: ".ai/assets/skills/software-development-orchestrator/templates/development-review-report-template.md"
examples:
  - ".dev/guides/ai-collaboration-guides/SOFTWARE-DEVELOPMENT-ORCHESTRATOR-SKILL-GUIDE.md"
human_guide: ".dev/guides/ai-collaboration-guides/SOFTWARE-DEVELOPMENT-ORCHESTRATOR-SKILL-GUIDE.md"
wrapper_targets:
  - "claude"
  - "codex"
wrapper_metadata:
  claude:
    wrapper_path: ".claude/skills/software-development-orchestrator/"
  codex:
    wrapper_path: ".agents/skills/software-development-orchestrator/"
status: "active"
effective_rule_consumption:
  applies_when:
    - "A routed development stage performs routine requirement, specification, framing, architecture, test-design, implementation, review, or compliance action."
  excludes:
    - "Workflow coordination, approval recording, work-item binding, checkpoint, and closeout-only work that does not perform an applicable action."
  resolver: ".ai/scripts/resolve-effective-rule-packet.py"
  selectors:
    - "capability"
    - "execution_mode"
    - "technology_profile"
    - "file_type"
  unresolved_outcome: "stop-applicable-action"
  consumption_order: "Consume a freshness-verified task-scoped packet before reading profile references needed for the applicable action."
  evidence:
    required:
      - "resolver_outcome"
      - "loaded_rule_ids"
      - "baseline.framework_version"
      - "target_state.digest"
      - "request.capability"
      - "request.execution_mode"
      - "request.technology_profile"
      - "request.file_type"
  semantic_consistency:
    identity: "rule_id"
    statement_bytes: "exact UTF-8 rules[].normative_statement bytes"
    statement_digest: "rules[].normative_statement_digest"
    cross_consumer_requirement: "the same rule_id must resolve to byte-equivalent effective semantics across consumers"
    default_mismatch_outcome: "warning"
    stricter_policy_owner: "target-owned"
  prohibitions:
    - "Do not scan broad target or framework documents to discover rule semantics."
    - "Do not fall back to framework defaults."
    - "Do not select an alternate route when the exact request route is unresolved."
    - "Do not compare analyzer output as effective-rule semantics."
    - "Keep analyzer severity and warnings-as-errors separate and target-owned."
