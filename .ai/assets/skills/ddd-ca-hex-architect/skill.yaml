asset_id: ddd-ca-hex-architect
schema_version: '1.0'
asset_type: skill-spec
title: DDD CA HEX Architect
purpose: Design and refactor architecture in this repository using DDD, Clean Architecture, CQRS, MQ-first integration, and a Hexagonal Architecture view of ports and adapters.
portability: repo-portable
audience: agent-facing
source_of_truth: canonical
capability_slots:
- architecture
triggers:
- architect
- DDD
- CA
- Hexagonal
- HEX
inputs:
- bounded context or module problem statement
- aggregate or use case scope
- repo rules, ADRs, or integration constraints
outputs:
- architecture decisions
- layer and adapter placement
- contract and persistence impact
- files, prompts, and ADRs to update
constraints:
- Cross-BC communication must stay MQ-only
- Do not redefine repo architecture rules mid-flight
workflow:
- step: 1
  description: Frame the design problem and classify the scope
- step: 2
  description: Apply DDD, CA, and HEX lenses together
- step: 3
  description: Bind the design to repo constraints and ADRs
- step: 4
  description: Load only the smallest relevant prompt/reference subset
- step: 5
  description: Return architect-grade decisions, placement, impact, and risks
references:
- .ai/assets/skills/ddd-ca-hex-architect/references/source-map.md
- .ai/assets/skills/ddd-ca-hex-architect/references/architecture-playbook.md
- .ai/assets/skills/ddd-ca-hex-architect/references/design-deliverables.md
- .ai/assets/skills/ddd-ca-hex-architect/references/prompt-templates.md
examples:
- .dev/guides/ai-collaboration-guides/DDD-CA-HEX-ARCHITECT-SKILL-GUIDE.md
human_guide: .dev/guides/ai-collaboration-guides/DDD-CA-HEX-ARCHITECT-SKILL-GUIDE.md
wrapper_targets:
- claude
- codex
wrapper_metadata:
  claude:
    wrapper_path: .claude/skills/ddd-ca-hex-architect/
  codex:
    wrapper_path: .agents/skills/ddd-ca-hex-architect/
status: active
effective_rule_consumption:
  applies_when:
  - The skill designs or refactors bounded-context, aggregate, port, adapter, contract, or integration architecture.
  excludes:
  - Requirement or specification intake, implementation execution, or a handoff that does not make an architecture decision.
  resolver: .ai/scripts/resolve-effective-rule-packet.py
  applicability:
    selector: applicability_mode
    modes:
      initialized-target:
        authority: .dev/ai-context/provenance.yaml
        rule_selection: exact target effective-state route
        downstream_provenance: required
  selectors:
  - capability
  - execution_mode
  - technology_profile
  - file_type
  unresolved_outcome: stop-applicable-action
  consumption_order: Select the applicability mode explicitly, then consume its freshness-verified task-scoped evidence before reading profile references needed for the applicable action.
  evidence:
    required_common:
    - resolver_outcome
    - applicability_mode
    - loaded_rule_ids
    - request.capability
    - request.execution_mode
    - request.technology_profile
    - request.file_type
    - rules[].normative_statement_digest
    - packet_digest
    required_by_mode:
      initialized-target:
      - baseline.framework_version
      - target_state.digest
  semantic_consistency:
    identity: rule_id
    statement_bytes: exact UTF-8 rules[].normative_statement bytes
    statement_digest: rules[].normative_statement_digest
    cross_consumer_requirement: the same rule_id must resolve to byte-equivalent effective semantics across consumers
    default_mismatch_outcome: warning
    stricter_policy_owner: target-owned in initialized-target mode
  prohibitions:
  - Do not infer applicability mode from repository contents, remembered state, or missing downstream provenance.
  - Do not scan broad target or framework documents to discover rule semantics.
  - Do not fall back to framework defaults.
  - Do not select an alternate route when the exact request route is unresolved.
  - Do not compare analyzer output as effective-rule semantics.
  - Keep analyzer severity and warnings-as-errors separate and target-owned.
