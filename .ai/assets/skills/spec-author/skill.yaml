asset_id: "spec-author"
schema_version: "1.0"
asset_type: "skill-spec"
title: "Spec Author"
purpose: "Draft or normalize repository production specs and test specs from requirements, existing specs, or codebase facts so they align with .dev/specs structure and schema rules."
portability: "repo-portable"
audience: "agent-facing"
source_of_truth: "canonical"
capability_slots:
  - "specification"
triggers:
  - "spec"
  - "draft spec"
  - "normalize spec"
  - "convert requirement to spec"
inputs:
  - "requirement files or summaries"
  - "existing spec drafts or code references"
  - "target aggregate or use case"
outputs:
  - "use-case, entity, adapter, or test spec draft"
  - "recommended file path under .dev/specs/"
  - "assumptions and missing fields"
constraints:
  - "Follow .dev/specs/SPEC-GUIDE.MD and .dev/specs/SPEC-ORGANIZATION-GUIDE.MD"
  - "Do not invent aggregate ownership when architecture boundaries are unclear"
  - "Separate production specs from test specs"
workflow:
  - step: 1
    description: "Choose the spec type and identify the target aggregate or use case"
  - step: 2
    description: "Draft the spec in the required JSON or markdown shape"
  - step: 3
    description: "Recommend the correct output path and next handoff"
references:
  - ".ai/assets/skills/spec-author/references/authoring-playbook.md"
  - ".ai/assets/skills/spec-author/references/output-contract.md"
  - ".ai/assets/skills/spec-author/references/type-selection.md"
examples:
  - ".dev/guides/ai-collaboration-guides/SPEC-DESIGNER-PROMPT-GUIDE.md"
human_guide: ".dev/guides/ai-collaboration-guides/SPEC-DESIGNER-PROMPT-GUIDE.md"
wrapper_targets:
  - "claude"
  - "codex"
wrapper_metadata:
  claude:
    wrapper_path: ".claude/skills/spec-author/"
  codex:
    wrapper_path: ".agents/skills/spec-author/"
status: "active"
effective_rule_consumption:
  applies_when:
    - "The skill authors or normalizes a production or test specification for the selected use case or aggregate."
  excludes:
    - "Requirement-only discussion, architecture decision intake, or a handoff that does not author or normalize a specification."
  resolver: ".ai/scripts/resolve-effective-rule-packet.py"
  selectors:
    - "capability"
    - "execution_mode"
    - "technology_profile"
    - "file_type"
  unresolved_outcome: "stop-applicable-action"
  consumption_order: "Consume a freshness-verified task-scoped packet before reading profile references needed for the applicable action."
  evidence:
    required:
      - "resolver_outcome"
      - "loaded_rule_ids"
      - "baseline.framework_version"
      - "target_state.digest"
      - "request.capability"
      - "request.execution_mode"
      - "request.technology_profile"
      - "request.file_type"
  semantic_consistency:
    identity: "rule_id"
    statement_bytes: "exact UTF-8 rules[].normative_statement bytes"
    statement_digest: "rules[].normative_statement_digest"
    cross_consumer_requirement: "the same rule_id must resolve to byte-equivalent effective semantics across consumers"
    default_mismatch_outcome: "warning"
    stricter_policy_owner: "target-owned"
  prohibitions:
    - "Do not scan broad target or framework documents to discover rule semantics."
    - "Do not fall back to framework defaults."
    - "Do not select an alternate route when the exact request route is unresolved."
    - "Do not compare analyzer output as effective-rule semantics."
    - "Keep analyzer severity and warnings-as-errors separate and target-owned."
