asset_id: "slice-implementer"
schema_version: "1.0"
asset_type: "skill-spec"
title: "Slice Implementer"
purpose: "Implement one bounded implementation slice from requirements, specs, architecture decisions, review findings, or workflow tasks without redefining the architecture direction."
portability: "repo-portable"
audience: "agent-facing"
source_of_truth: "canonical"
capability_slots:
  - "implementation"
triggers:
  - "slice implementer"
  - "implement slice"
  - "bounded implementation slice"
  - "feature slice"
  - "fix slice"
  - "remediation slice"
inputs:
  - "authorization source, normative truth, and optional finding evidence"
  - "bounded slice goal, acceptance criteria, and explicit non-goals"
  - "intent, scope, execution mode, and optional overlays"
  - "validation requirements"
outputs:
  - "bounded implementation slice"
  - "intent, execution mode, overlays, and reference paths used"
  - "touched files and validation notes"
  - "explicit handoff if architecture, local change, test design, review, or compliance work remains"
  - "one provider-neutral role_execution record for every considered role binding, handed to the orchestrator without transferring slice ownership"
constraints:
  - "Do not redefine architecture direction mid-slice"
  - "Do not silently broaden the agreed slice"
  - "Select exactly one execution mode reference: command, query, reactor, or generic"
  - "Apply remediation as an overlay without replacing the selected execution mode"
  - "Do not treat workflow authorization or finding evidence as a substitute for normative requirements, specs, standards, or ADRs"
  - "Delegate local class/object/symbol technical edits to local-change-implementer when useful"
  - "Stop and hand off when bounded context, aggregate boundary, dependency direction, or domain language is unclear"
role_bindings:
  - role_path: ".ai/assets/sub-agent-role-prompts/command-sub-agent/sub-agent.yaml"
    role_asset_id: "command-sub-agent"
    expected_role_status: "active"
    binding_kind: "primary"
    applicability: "The bounded slice selects command as its exactly one primary execution mode."
    load_obligation: "mandatory-when-applicable"
  - role_path: ".ai/assets/sub-agent-role-prompts/query-sub-agent/sub-agent.yaml"
    role_asset_id: "query-sub-agent"
    expected_role_status: "active"
    binding_kind: "primary"
    applicability: "The bounded slice selects query as its exactly one primary execution mode."
    load_obligation: "mandatory-when-applicable"
  - role_path: ".ai/assets/sub-agent-role-prompts/reactor-sub-agent/sub-agent.yaml"
    role_asset_id: "reactor-sub-agent"
    expected_role_status: "active"
    binding_kind: "primary"
    applicability: "The bounded slice selects reactor as its exactly one primary execution mode."
    load_obligation: "mandatory-when-applicable"
  - role_path: ".ai/assets/sub-agent-role-prompts/aggregate-sub-agent/sub-agent.yaml"
    role_asset_id: "aggregate-sub-agent"
    expected_role_status: "active"
    binding_kind: "conditional"
    applicability: "The selected slice needs an aggregate or event-sourced domain implementation shape without replacing its one primary execution mode."
    load_obligation: "mandatory-when-applicable"
  - role_path: ".ai/assets/sub-agent-role-prompts/controller-sub-agent/sub-agent.yaml"
    role_asset_id: "controller-sub-agent"
    expected_role_status: "active"
    binding_kind: "conditional"
    applicability: "The selected slice needs an ASP.NET Core controller or endpoint implementation shape without replacing its one primary execution mode."
    load_obligation: "mandatory-when-applicable"
  - role_path: ".ai/assets/sub-agent-role-prompts/outbox-sub-agent/sub-agent.yaml"
    role_asset_id: "outbox-sub-agent"
    expected_role_status: "active"
    binding_kind: "conditional"
    applicability: "The selected slice needs outbox persistence or publishing work without replacing its one primary execution mode."
    load_obligation: "mandatory-when-applicable"
  - role_path: ".ai/assets/sub-agent-role-prompts/profile-config-sub-agent/sub-agent.yaml"
    role_asset_id: "profile-config-sub-agent"
    expected_role_status: "active"
    binding_kind: "conditional"
    applicability: "The selected slice needs environment-profile or appsettings configuration work without replacing its one primary execution mode."
    load_obligation: "mandatory-when-applicable"
  - role_path: ".ai/assets/sub-agent-role-prompts/usecase-test-sub-agent/sub-agent.yaml"
    role_asset_id: "usecase-test-sub-agent"
    expected_role_status: "active"
    binding_kind: "conditional"
    applicability: "The selected slice includes concrete use-case test implementation; a test-only slice uses generic as its one primary execution mode, while BDD design and test execution remain separate."
    load_obligation: "mandatory-when-applicable"
  - role_path: ".ai/assets/sub-agent-role-prompts/aggregate-test-sub-agent/sub-agent.yaml"
    role_asset_id: "aggregate-test-sub-agent"
    expected_role_status: "active"
    binding_kind: "conditional"
    applicability: "The selected slice includes concrete aggregate test implementation; a test-only slice uses generic as its one primary execution mode, while BDD design and test execution remain separate."
    load_obligation: "mandatory-when-applicable"
  - role_path: ".ai/assets/sub-agent-role-prompts/controller-test-sub-agent/sub-agent.yaml"
    role_asset_id: "controller-test-sub-agent"
    expected_role_status: "active"
    binding_kind: "conditional"
    applicability: "The selected slice includes concrete controller or API test implementation; a test-only slice uses generic as its one primary execution mode, while BDD design and test execution remain separate."
    load_obligation: "mandatory-when-applicable"
  - role_path: ".ai/assets/sub-agent-role-prompts/reactor-test-sub-agent/sub-agent.yaml"
    role_asset_id: "reactor-test-sub-agent"
    expected_role_status: "active"
    binding_kind: "conditional"
    applicability: "The selected slice includes concrete reactor test implementation; a test-only slice uses generic as its one primary execution mode, while BDD design and test execution remain separate."
    load_obligation: "mandatory-when-applicable"
  - role_path: ".ai/assets/sub-agent-role-prompts/mutation-testing-sub-agent/sub-agent.yaml"
    role_asset_id: "mutation-testing-sub-agent"
    expected_role_status: "active"
    binding_kind: "conditional"
    applicability: "Owner-authorized mutation-coverage or test-strengthening work is in the selected bounded slice; test execution remains a separate capability."
    load_obligation: "mandatory-when-applicable"
workflow:
  - step: 1
    description: "Confirm slice goal, intent, scope, execution mode, overlays, layered sources, acceptance criteria, non-goals, and each role binding's applicability"
  - step: 2
    description: "Load exactly one execution mode reference, any applicable overlay, required local standards, and the exact matching role manifest with all of its mandatory references"
  - step: 3
    description: "Implement the smallest coherent slice directly by default; delegate only when the role-execution safety gates and value trigger permit it, while retaining slice-domain integration"
  - step: 4
    description: "Validate, record touched files and role_execution, aggregate no synthetic child evidence, and hand off remaining architecture, testing, review, or compliance work"
references:
  - ".ai/assets/skills/slice-implementer/references/input-contract.md"
  - ".ai/assets/skills/slice-implementer/references/execution-playbook.md"
  - ".ai/assets/skills/slice-implementer/references/role-execution.md"
  - ".ai/assets/skills/slice-implementer/references/handoff-rules.md"
  - ".ai/assets/skills/slice-implementer/references/modes/command-use-case.md"
  - ".ai/assets/skills/slice-implementer/references/modes/query-use-case.md"
  - ".ai/assets/skills/slice-implementer/references/modes/reactor.md"
  - ".ai/assets/skills/slice-implementer/references/modes/generic-slice.md"
  - ".ai/assets/skills/slice-implementer/references/overlays/remediation.md"
examples:
  - ".dev/guides/ai-collaboration-guides/SLICE-IMPLEMENTER-SKILL-GUIDE.md"
human_guide: ".dev/guides/ai-collaboration-guides/SLICE-IMPLEMENTER-SKILL-GUIDE.md"
wrapper_targets:
  - "claude"
  - "codex"
wrapper_metadata:
  claude:
    wrapper_path: ".claude/skills/slice-implementer/"
  codex:
    wrapper_path: ".agents/skills/slice-implementer/"
status: "active"
effective_rule_consumption:
  applies_when:
    - "The skill implements one bounded command, query, reactor, or generic slice selected by the task."
  excludes:
    - "Architecture redesign, unbounded multi-slice work, or a handoff that does not implement the selected slice."
  resolver: ".ai/scripts/resolve-effective-rule-packet.py"
  selectors:
    - "capability"
    - "execution_mode"
    - "technology_profile"
    - "file_type"
  unresolved_outcome: "stop-applicable-action"
  consumption_order: "Consume a freshness-verified task-scoped packet before reading profile references needed for the applicable action."
  evidence:
    required:
      - "resolver_outcome"
      - "loaded_rule_ids"
      - "baseline.framework_version"
      - "target_state.digest"
      - "request.capability"
      - "request.execution_mode"
      - "request.technology_profile"
      - "request.file_type"
  semantic_consistency:
    identity: "rule_id"
    statement_bytes: "exact UTF-8 rules[].normative_statement bytes"
    statement_digest: "rules[].normative_statement_digest"
    cross_consumer_requirement: "the same rule_id must resolve to byte-equivalent effective semantics across consumers"
    default_mismatch_outcome: "warning"
    stricter_policy_owner: "target-owned"
  prohibitions:
    - "Do not scan broad target or framework documents to discover rule semantics."
    - "Do not fall back to framework defaults."
    - "Do not select an alternate route when the exact request route is unresolved."
    - "Do not compare analyzer output as effective-rule semantics."
    - "Keep analyzer severity and warnings-as-errors separate and target-owned."
