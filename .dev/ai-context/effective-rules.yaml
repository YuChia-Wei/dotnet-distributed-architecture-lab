    explicit: true
    verification:
      status: verified
      evidence: *id004
- rule_id: CONTRACT-SEMANTICS-001
  effective_disposition: baseline-effective
  applicability: Domain behavior declares and enforces preconditions and invariants
    for products, orders, and inventory.
  evidence: &id005
  - src/Product/DomainCore/SaleProducts.Domains/Product.cs
  - src/Order/DomainCore/SaleOrders.Domains/Order.cs
  - src/Inventory/DomainCore/InventoryControl.Domains/InventoryItem.cs
  baseline_acceptance:
    explicit: true
    verification:
      status: verified
      evidence: *id005
- rule_id: DELETE-PURGE-001
  effective_disposition: baseline-effective
  applicability: Inventory persistence contains an executable physical-delete implementation,
    so purge/archive governance cannot be globally excluded.
  evidence: &id006
  - src/Inventory/DomainCore/InventoryControl.Infrastructure/Applications/Repositories/InventoryItemDomainRepository.cs
