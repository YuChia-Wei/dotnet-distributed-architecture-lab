    explicit: true
    verification:
      status: verified
      evidence: *id002
- rule_id: ARCH-UOW-001
  effective_disposition: baseline-effective
  applicability: Command use cases persist aggregates, use explicit local transactions
    for aggregate/outbox consistency, and message across bounded contexts.
  evidence: &id003
  - src/Product/DomainCore/SaleProducts.Infrastructure/Repositories/ProductDomainRepository.cs
  - src/Order/DomainCore/SaleOrders.Infrastructure/Applications/Repositories/OrderEventSourcingRepository.cs
  - .dev/ARCHITECTURE.md
  baseline_acceptance:
    explicit: true
    verification:
      status: verified
      evidence: *id003
- rule_id: ASSESSMENT-ARTIFACT-001
  effective_disposition: baseline-effective
  applicability: AI-context audits, code reviews, and architecture assessments are
    persisted as governed assessment artifacts.
  evidence: &id004
  - .dev/assessments/ASM-20260812-001/report.md
  - .dev/assessments/ASM-20260812-002/report.md
  - .dev/standards/ASSESSMENT-ARTIFACT-POLICY.md
