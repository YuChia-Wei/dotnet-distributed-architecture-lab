rule_dispositions:
- rule_id: AGGREGATE-ES-001
  effective_disposition: baseline-effective
  applicability: Orders adopts event sourcing and reconstructs Order by replaying
    persisted domain events through EsAggregateRoot behavior.
  evidence: &id001
  - src/Order/DomainCore/SaleOrders.Domains/Order.cs
  - src/Order/DomainCore/SaleOrders.Infrastructure/Applications/Repositories/OrderEventSourcingRepository.cs
  - tests/SaleOrders.Domains.Tests/OrderTests.cs
  - .dev/workflows/2026-08-12-ai-context-v0-13-upgrade/evidence/v0.9.0/effective-rule-decisions.yaml
  - .dev/workflows/2026-08-12-ai-context-v0-13-upgrade/evidence/v0.13.0/aggregate-es-001-remediation.yaml
  - .dev/assessments/ASM-20260813-006/report.md
  baseline_acceptance:
    explicit: true
    verification:
      status: verified
      evidence: *id001
- rule_id: AICTX-EVIDENCE-001
  effective_disposition: baseline-effective
  applicability: AI-context initialization, upgrade, audit, and development must rely
    on repository-backed evidence and disclose optional external discovery.
  evidence: &id002
  - .dev/workflows/2026-08-12-ai-context-v0-13-upgrade/evidence/v0.9.0/apply-receipt.yaml
  - .dev/workflows/2026-08-12-ai-context-v0-13-upgrade/evidence/v0.9.0/post-apply-required-path-reconciliation.yaml
  - .dev/workflows/2026-08-12-ai-context-v0-13-upgrade/evidence/v0.9.0/effective-rule-decisions.yaml
  baseline_acceptance:
    explicit: true
    verification:
      status: verified
      evidence: *id002
- rule_id: ARCH-UOW-001
  effective_disposition: baseline-effective
  applicability: Command use cases persist aggregates, use explicit local transactions
    for aggregate/outbox consistency, and message across bounded contexts.
  evidence: &id003
  - src/Product/DomainCore/SaleProducts.Infrastructure/Repositories/ProductDomainRepository.cs
  - src/Order/DomainCore/SaleOrders.Infrastructure/Applications/Repositories/OrderEventSourcingRepository.cs
  - .dev/ARCHITECTURE.md
  baseline_acceptance:
    explicit: true
    verification:
      status: verified
      evidence: *id003
- rule_id: ASSESSMENT-ARTIFACT-001
  effective_disposition: baseline-effective
  applicability: AI-context audits, code reviews, and architecture assessments are
    persisted as governed assessment artifacts.
  evidence: &id004
  - .dev/assessments/ASM-20260812-001/report.md
  - .dev/assessments/ASM-20260812-002/report.md
  - .dev/standards/ASSESSMENT-ARTIFACT-POLICY.md
  baseline_acceptance:
    explicit: true
    verification:
      status: verified
      evidence: *id004
- rule_id: CONTRACT-SEMANTICS-001
  effective_disposition: baseline-effective
  applicability: Domain behavior declares and enforces preconditions and invariants
    for products, orders, and inventory.
  evidence: &id005
  - src/Product/DomainCore/SaleProducts.Domains/Product.cs
  - src/Order/DomainCore/SaleOrders.Domains/Order.cs
  - src/Inventory/DomainCore/InventoryControl.Domains/InventoryItem.cs
  baseline_acceptance:
    explicit: true
    verification:
      status: verified
      evidence: *id005
- rule_id: DELETE-PURGE-001
  effective_disposition: baseline-effective
  applicability: Inventory persistence contains an executable physical-delete implementation,
    so purge/archive governance cannot be globally excluded.
  evidence: &id006
  - src/Inventory/DomainCore/InventoryControl.Infrastructure/Applications/Repositories/InventoryItemDomainRepository.cs
  - .dev/workflows/2026-08-12-ai-context-v0-13-upgrade/evidence/v0.9.0/effective-rule-decisions.yaml
  baseline_acceptance:
    explicit: true
    verification:
      status: verified
      evidence: *id006
- rule_id: DELETE-SOFT-001
  effective_disposition: baseline-effective
  applicability: Products persists an isdeleted marker and filters deleted records
    from aggregate and query repositories.
  evidence: &id007
  - src/Product/DomainCore/SaleProducts.Infrastructure/Repositories/ProductDomainRepository.cs
  - src/Product/DomainCore/SaleProducts.Infrastructure/Repositories/ProductQueryRepository.cs
  - src/Product/DomainCore/SaleProducts.Domains/Product.cs
  baseline_acceptance:
    explicit: true
    verification:
      status: verified
      evidence: *id007
- rule_id: MAP-EVENTS-001
  effective_disposition: baseline-effective
  applicability: Order reconstruction replays persisted events without creating pending
    events, and tests verify clean rehydration behavior.
  evidence: &id008
  - src/BuildingBlocks/Lab.BuildingBlocks.Domains/EsAggregateRoot.cs
  - src/Order/DomainCore/SaleOrders.Infrastructure/Applications/Repositories/OrderEventSourcingRepository.cs
  - tests/SaleOrders.Domains.Tests/OrderTests.cs
  baseline_acceptance:
    explicit: true
    verification:
      status: verified
      evidence: *id008
- rule_id: PROJECT-GRAMMAR-001
  effective_disposition: baseline-effective
  applicability: The target adopts the conditional slnx navigation profile with bounded
    context DomainCore and Presentation solution folders.
  evidence: &id009
  - MQArchLab.slnx
  - .dev/project-config.yaml
  baseline_acceptance:
    explicit: true
    verification:
      status: verified
      evidence: *id009
- rule_id: TECH-SELECT-001
  effective_disposition: baseline-effective
  applicability: Testing, persistence, messaging, and observability choices are explicit,
    evidence-backed, and recorded in target configuration.
  evidence: &id010
