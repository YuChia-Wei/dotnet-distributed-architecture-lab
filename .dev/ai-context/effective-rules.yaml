  baseline_acceptance:
    explicit: true
    verification:
      status: verified
      evidence: *id006
- rule_id: DELETE-SOFT-001
  effective_disposition: baseline-effective
  applicability: Products persists an isdeleted marker and filters deleted records
    from aggregate and query repositories.
  evidence: &id007
  - src/Product/DomainCore/SaleProducts.Infrastructure/Repositories/ProductDomainRepository.cs
  - src/Product/DomainCore/SaleProducts.Infrastructure/Repositories/ProductQueryRepository.cs
  - src/Product/DomainCore/SaleProducts.Domains/Product.cs
  baseline_acceptance:
    explicit: true
    verification:
      status: verified
      evidence: *id007
- rule_id: MAP-EVENTS-001
  effective_disposition: baseline-effective
  applicability: Order reconstruction replays persisted events without creating pending
    events, and tests verify clean rehydration behavior.
  evidence: &id008
  - src/BuildingBlocks/Lab.BuildingBlocks.Domains/EsAggregateRoot.cs
  - src/Order/DomainCore/SaleOrders.Infrastructure/Applications/Repositories/OrderEventSourcingRepository.cs
  - tests/SaleOrders.Domains.Tests/OrderTests.cs
