  - tests/SaleOrders.Tests/SaleOrders.Tests.csproj
  - tests/SaleProducts.Tests/SaleProducts.Tests.csproj
  - .dev/workflows/2026-08-12-ai-context-v0-13-upgrade/evidence/v0.9.0/effective-rule-decisions.yaml
  baseline_acceptance:
    explicit: true
    verification:
      status: verified
