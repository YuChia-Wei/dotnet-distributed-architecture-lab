rule_dispositions:
- rule_id: AGGREGATE-ES-001
  effective_disposition: baseline-effective
  applicability: Orders adopts event sourcing and reconstructs Order by replaying
    persisted domain events through EsAggregateRoot behavior.
  evidence: &id001
  - src/Order/DomainCore/SaleOrders.Domains/Order.cs
  - src/Order/DomainCore/SaleOrders.Infrastructure/Applications/Repositories/OrderEventSourcingRepository.cs
  - tests/SaleOrders.Domains.Tests/OrderTests.cs
  - .dev/workflows/2026-08-12-ai-context-v0-13-upgrade/evidence/v0.9.0/effective-rule-decisions.yaml
  - .dev/workflows/2026-08-12-ai-context-v0-13-upgrade/evidence/v0.13.0/aggregate-es-001-remediation.yaml
