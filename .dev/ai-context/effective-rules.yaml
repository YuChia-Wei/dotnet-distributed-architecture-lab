    verification:
      status: verified
      evidence: *id010
- rule_id: TEST-BDDFY-001
  effective_disposition: baseline-effective
  applicability: The dotnet-backend profile applies and the target explicitly selects
    the baseline-permitted plain-xUnit branch with mandatory GWT semantics.
  evidence: &id011
