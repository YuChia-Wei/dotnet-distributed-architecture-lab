  - tests/SaleOrders.Tests/SaleOrders.Tests.csproj
  - tests/SaleProducts.Tests/SaleProducts.Tests.csproj
  - .dev/workflows/2026-08-12-ai-context-v0-13-upgrade/evidence/v0.9.0/effective-rule-decisions.yaml
  baseline_acceptance:
    explicit: true
    verification:
      status: verified
      evidence: *id011
- rule_id: TEST-GWT-001
  effective_disposition: baseline-effective
  applicability: New and modified tests use recognizable Given-When-Then semantics
