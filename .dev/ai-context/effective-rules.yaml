  baseline_acceptance:
    explicit: true
    verification:
      status: verified
      evidence: *id001
- rule_id: AICTX-EVIDENCE-001
  effective_disposition: baseline-effective
  applicability: AI-context initialization, upgrade, audit, and development must rely
    on repository-backed evidence and disclose optional external discovery.
