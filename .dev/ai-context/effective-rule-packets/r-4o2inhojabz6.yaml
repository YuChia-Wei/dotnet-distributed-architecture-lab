  normative_statement: "## Transaction Contract\n\nFor a selected transactional message\
    \ path:\n\n1. The Application Use Case declares the required local consistency\
    \ and\n   orchestrates Aggregate behavior and outbound ports.\n2. Exactly one\
    \ selected component physically completes the local transaction:\n   an explicit\
    \ Unit of Work **or** a verified runtime transaction pipeline.\n   Repositories,\
    \ message adapters, and decorators participate; they do not add\n   an independent\
    \ commit path.\n3. When the selected store and runtime contract support enrollment,\
    \ commit\n   Aggregate state, durable outgoing intent, and successful incoming-processing\n\
    \   completion in that one local transaction.\n4. Persisting an incoming envelope\
    \ or claiming broker delivery is distinct from\n   successful business processing.\
    \ Initial durable receipt must not be reported\n   as completed processing.\n\n\
    The contract is local. It does not make an external broker, HTTP API, file\nsystem,\
    \ or another database part of the transaction, and it does not provide\nend-to-end\
    \ exactly-once delivery. External effects are represented by durable\nintent and\
    \ remain retryable after the local commit.\n\nInbox and outbox records are technical\
    \ persistence with operational semantics;\nthey are not Domain Aggregates merely\
    \ to fit a Repository shape. A target may\nuse conditional updates, uniqueness\
    \ constraints, claimed states, and\ncapability-specific adapters. It must define\
    \ the relevant concurrency behavior.\n"
  normative_statement_digest: 9d6358ad89a2fadaa9ff2ebba69d2cb9728500751c921609d41a42efe5383b7a
