  normative_statement: "## Optional `EsAggregateRoot<TId>` Behavior Contract\n\nRule\
    \ ID: `AGGREGATE-ES-001` (`conditional` when Event Sourcing is selected).\n\n\
    `EsAggregateRoot<TId>` is the only supplied optional base class. A target may\n\
    copy the source include, reimplement this contract, or use another implementation\n\
    that preserves the behavior.\n\n### Required behavior\n\n1. `Replay(history)`\
    \ dispatches committed events to `When` in order.\n2. Replay increments the committed\
    \ `Version` once per event.\n3. Replay never adds events to the pending-event\
    \ collection.\n4. `Apply(event)` dispatches the event to `When` before recording\
    \ it as pending.\n5. If `When` rejects an event, that event is not recorded as\
    \ pending.\n6. `Apply` does not advance the committed `Version`.\n7. `MarkChangesAsCommitted(committedVersion)`\
    \ accepts only\n   `Version + pending-count`.\n8. A successful commit advances\
    \ `Version` and clears pending events exactly\n   once.\n9. A rejected commit\
    \ confirmation preserves the committed version and pending\n   events for retry\
    \ or diagnosis.\n10. Product state changes occur only in `When`; `When` is deterministic\
    \ and\n    performs no external I/O.\n\n### Construction rule\n\nDo not invoke\
    \ virtual `When` from the base constructor. In C#, a derived type's\nfield initializers\
    \ have not completed while its base constructor executes.\nThe derived reconstruction\
    \ constructor calls `Replay(history)` from its own\nconstructor body:\n\n```csharp\n\
    public sealed class Order : EsAggregateRoot<OrderId>\n{\n    private readonly\
    \ List<OrderLine> _lines = [];\n\n    public Order(IEnumerable<IDomainEvent> history)\n\
    \    {\n        Replay(history);\n    }\n\n    protected override void When(IDomainEvent\
    \ @event)\n    {\n        // deterministic type dispatch\n    }\n}\n```\n\nThe\
    \ repository-owned source include is under\n[`source-includes/domain/`](../source-includes/domain/).\
    \ It is reference-only\nframework material, not a published package or complete\
    \ reference product. An\nadopting target owns SDK compatibility, compilation,\
    \ behavior tests, invocation\nevidence, and upgrade reconciliation before claiming\
    \ executable validation.\n"
  normative_statement_digest: 262144bbec5431033e252c4c128025a5563f13f2d6c5610e86d51f7c19b4e4a3
