  effective_disposition: baseline-effective
  normative_statement: "### 7. Strong Consistency MUST Be Explicit\n\nOne command\
    \ changes one Aggregate by default. Events and eventual consistency are\nthe default\
    \ for coordination between Aggregates. A Use Case may inject\n`IUnitOfWork` for\
    \ multiple Aggregates only as an exceptional same-bounded-context\ndecision when\
    \ all of these conditions hold:\n\n1. The business names an all-or-nothing invariant\
    \ involving the Aggregates.\n2. Any eventually consistent intermediate state would\
    \ be unacceptable and cannot\n   be safely compensated.\n3. The design rechecks\
    \ that the Aggregate boundaries are correct instead of using\n   a transaction\
    \ to hide a misplaced invariant.\n4. The decision documents the invariant, the\
    \ involved Aggregates, and why eventual\n   consistency or compensation is insufficient.\n\
    \nThe following Reservation + Capacity example represents such an exceptional\n\
    business rule; it is not a general Use Case template:\n\n```csharp\npublic sealed\
    \ class CompleteReservationUseCase\n{\n    private readonly IUnitOfWork unitOfWork;\n\
    \n    public async Task ExecuteAsync(CancellationToken cancellationToken)\n  \
    \  {\n        // Exceptional case: Reservation and Capacity are in the same bounded\n\
    \        // context and the named invariant requires both changes to succeed or\n\
    \        // neither to succeed. An intermediate overbooked state is unacceptable\n\
    \        // and cannot be safely compensated. Do not copy this as a general template.\n\
    \        // Load Reservation and Capacity, invoke Domain behavior, and save through\
    \ ports.\n        await this.unitOfWork.CommitAsync(cancellationToken);\n    }\n\
    }\n```\n\n- MUST NOT select a multi-Aggregate transaction because of shared storage,\
    \ ORM or\n  framework capabilities, fewer I/O round trips, implementation convenience,\
    \ or a\n  general future need.\n- MUST NOT make `IUnitOfWork` a default Use Case\
    \ dependency.\n- MUST NOT span bounded contexts with one transaction; cross-bounded-context\n\
    \  coordination uses integration events and eventual consistency.\n- A Repository\
    \ participating in a Unit of Work MUST NOT commit independently.\n- A Handler\
    \ MUST NOT introduce a transaction or commit after the Use Case. A\n  selected\
    \ runtime pipeline or middleware may enroll and complete the processing\n  transaction\
    \ outside the Handler; it does not make the Handler a transaction owner.\n- Pending\
    \ Domain Events may be acknowledged or cleared only after a successful commit.\n\
    \nFor a selected transactional message path, the Use Case declares and\norchestrates\
    \ the required local consistency; the selected Unit of Work or\nverified runtime\
    \ pipeline physically completes it. This does not make\n`IUnitOfWork` a default\
    \ Use Case dependency and does not weaken the\nmulti-Aggregate, same-bounded-context\
    \ exception above. See\n[Transactional Messaging Standards](transactional-messaging-standards.md)\
    \ for\nthe single completion-owner, inbox/outbox, and adapter contract.\n"
  normative_statement_digest: 0bc2ba0f84e5a4faed68487721b1ac9b501a68e8ad714225da143ef6abaa6ee8
  disposition_record:
    applicability: Command use cases persist aggregates, use explicit local transactions
