  effective_disposition: baseline-effective
  normative_statement: "### 6. Mocking Library Selection\n\nNSubstitute is the `TEST-MOCK-001`\
    \ profile default. Before generating or\nreviewing mocks, resolve `testing.mocking`\
    \ through\n`.dev/project-config.yaml#technologySelections` and\n[Target Technology\
    \ Selection Policy](../../../../../../.dev/standards/TECHNOLOGY-SELECTION-POLICY.md).\n\
    \n- When no target selection exists, use NSubstitute.\n- When an evidenced target\
    \ selection exists, use that library consistently.\n- Do not mix mocking libraries\
    \ without an explicit migration decision.\n- Changing the library does not change\
    \ GWT, test independence, or boundary\n  interaction rules.\n\n```csharp\n// ✅\
    \ Correct: NSubstitute\nvar repository = Substitute.For<IAggregateRepository<Product,\
    \ ProductId>>();\nrepository.FindByIdAsync(Arg.Any<ProductId>(), Arg.Any<CancellationToken>())\n\
    \    .Returns(Task.FromResult<Product?>(existingProduct));\n\n// Verify the call\n\
    await repository.Received(1).SaveAsync(Arg.Any<Product>(), Arg.Any<CancellationToken>());\n\
    \n// Valid only when the target explicitly selects Moq\nvar repository = new Mock<IAggregateRepository<Product,\
    \ ProductId>>();\nrepository.Setup(x => x.FindByIdAsync(...)).ReturnsAsync(existingProduct);\n\
    repository.Verify(x => x.SaveAsync(...), Times.Once);\n```\n\n---\n"
  normative_statement_digest: 8ff4679c135e2de0f7a370317da2da76ee4a5bf7ca6ef076dc85d0aaeed23503
  disposition_record:
