  normative_statement: '## Assessment Versus Workflow


    | Mode | Use | Durable artifact |

    | --- | --- | --- |

    | Transient analysis | Read-only analysis that remains in the conversation. |
    none |

    | Standalone assessment | A persisted audit, large code review, architecture assessment,
    or technical-debt inventory without authorized remediation. | `.dev/assessments/<assessment-id>/`
    |

    | Workflow execution | Authorized multi-stage work, remediation, or source-of-truth
    change. | `.dev/workflows/<workflow-id>/` |


    Persistence alone does not turn an observation into a workflow. If the user asks

    to assess and remediate in one request, store the assessment under

    `.dev/assessments/` and store execution state under the owning workflow. The

    workflow references the assessment; it does not copy the report.

    '
