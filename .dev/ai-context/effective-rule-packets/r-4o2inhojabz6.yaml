  effective_disposition: baseline-effective
  normative_statement: "### 3. Use GWT; Default to BDDfy\n\n**Mandatory**: All tests\
    \ must use Given-When-Then semantics and recognizable step names. Arrange-Act-Assert\
    \ (3A) must not replace GWT. Use Case and integration tests default to BDDfy;\
    \ plain xUnit may implement the same GWT structure only when the target team explicitly\
    \ opts out of that package.\n\n`.feature` files and runners are not minimum dependencies.\
    \ When requirements directly provide a `.feature` file, its design or production\
    \ is explicitly requested, or the target profile has adopted a runner, create\
    \ or maintain it according to the [Gherkin Feature Storage Guide](../../../../../../.dev/specs/tests/GHERKIN-FEATURE-STORAGE-GUIDE.MD).\
    \ Otherwise, express the scenario directly as a GWT-style C# test.\n\n#### Step\
    \ Methods And Scenario Readability\n\nFor scenario-style unit, Use Case and integration\
    \ tests, the test method must\nread as Given/When/Then step calls, directly or\
    \ through the selected fluent\nrunner. Give methods behavior-specific names such\
    \ as `GivenMonthlyBudget`,\n`WhenQueryingBudget` and `ThenAmountShouldBe`; comments\
    \ or generic `Setup`,\n`Execute` and `Check` methods alone do not satisfy this\
    \ form. Preserve the\ncompact exception-contract form explicitly permitted in\
    \ section 5; it still\nneeds an observable exception assertion and source traceability.\n\
    \n| Step | Responsibility | Must not substitute for |\n| --- | --- | --- |\n|\
    \ Given | Establish the scenario's data/state and controlled dependency responses.\
    \ Put reusable construction mechanics in helpers. | The primary action or the\
    \ scenario's outcome assertions. Fixture guards may fail fast but are not Then\
    \ coverage. |\n| When | Execute the real subject's primary behavior once per scenario/data\
    \ row and capture its result, state or exception. An intentional multi-operation\
    \ behavior must be explicit in the design. | A mock of the subject, a fabricated\
    \ result, or a hidden repeat of the action during verification. |\n| Then / And\
    \ | Assert each specified observable value, relation, state, event or exception\
    \ against the result of that When. | Re-executing the subject, calculating the\
    \ expected answer using its algorithm, or merely checking that no exception occurred\
    \ when a value is specified. |\n\nKeep material inputs and expected values visible\
    \ in the scenario method or its\nexplicitly bound theory row. A business-named\
    \ builder may encapsulate irrelevant\ndefaults; it must not hide the values that\
    \ distinguish scenarios. Use fresh\nper-test state, instance fixtures with isolated\
    \ scenario state, or explicit\narguments/results. Avoid static mutable scenario\
    \ fields and test-order coupling.\nA result field must distinguish \"not executed\"\
    \ from a legitimate default result\n(for example, nullable captured data with\
    \ a Then assertion that it is present).\n\nFor asynchronous behavior, await the\
    \ step to completion using the selected\nrunner's supported Task API. Do not use\
    \ `async void`, fire-and-forget actions,\n`.Wait()` or `.Result`. Capture expected\
    \ exceptions during When (for example\nwith xUnit `Record.ExceptionAsync`) and\
    \ assert the required type and relevant\ndetails during Then; do not swallow exceptions\
    \ to make the test green. A bounded\neventual assertion may wait for an observable\
    \ asynchronous outcome, but must not\nrepeat the command/query that caused it.\n\
    \nUse the [GWT handoff contract](../../../../shared/GWT-TEST-HANDOFF-CONTRACT.md)\n\
    to preserve scenario/data-row IDs, source/AC bindings and every Then-to-assertion\n\
    mapping. Parameterized cases are valid when each row remains identifiable and\n\
    uses the same behavior and assertion responsibilities. A generated report,\nmethod-name\
    \ match, successful build or passing run alone cannot prove that the\nscenario\
    \ was implemented faithfully.\n\n#### Default BDDfy Form\n\nThis excerpt's fixture\
    \ and step implementations are in the\n[runnable step-method example](../../examples/bdd-step-methods/README.md).\n\
    It exposes the behavior-bearing data while keeping mechanics inside steps.\n\n\
    ```csharp\n[Fact]\npublic void Should_return_zero_when_query_month_has_no_budget()\n\
    {\n    this.Given(x => x.GivenMonthlyBudget(\"202102\", 28m))\n        .When(x\
    \ => x.WhenQueryingBudget(\n            new DateOnly(2021, 1, 1), new DateOnly(2021,\
    \ 1, 2)))\n        .Then(x => x.ThenAmountShouldBe(0m))\n        .BDDfy();\n}\n\
    ```\n\n#### Explicit Plain-xUnit Opt-Out Form\n\nThe same example includes a separately\
    \ selected BDDfy opt-out. Opting out of\nthe package preserves method responsibilities\
    \ and GWT semantics.\n\n```csharp\n[Fact]\npublic async Task Should_return_zero_when_query_month_has_no_budget()\n\
    {\n    GivenMonthlyBudget(\"202102\", 28m);\n    var actual = await WhenQueryingBudget(\n\
    \        new DateOnly(2021, 1, 1), new DateOnly(2021, 1, 2));\n    ThenAmountShouldBe(actual,\
    \ 0m);\n}\n```\n\nTest the concrete Use Case directly for business-flow behavior\
    \ and mock its\noutbound ports. Handler adapter tests remain separate and narrow:\
    \ verify only\nCommand-to-Input mapping, exactly one Use Case invocation, and\
    \ delivery-specific\nfailure mapping. A Handler test that mocks a Repository must\
    \ not duplicate\nresponsibility for business-flow testing.\n\n---\n"
  normative_statement_digest: 81fa3b215c6677225c3fdca9a4aca1a8237bd10558c0d7a1d6bfbc5dddedb199
  disposition_record:
    applicability: The dotnet-backend profile applies and the target explicitly selects
