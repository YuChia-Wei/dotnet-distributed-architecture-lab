  catalog_normative_statement_digest: 128cc7e3a4315baa4ac69fbc944e11297eaaedef745de742350ebe522130f69c
  effective_disposition: baseline-effective
  normative_statement: "### Workload Mapping\n\nRule ID: `PROJECT-GRAMMAR-001` (`profile-default`).\n\
    \n`workload` is a logical solution-navigation boundary, not a universal physical\n\
    directory name:\n\n| Repository profile | `workload` means | Typical count | Example\
    \ logical folders |\n| --- | --- | --- | --- |\n| micro-system / mini-system mono\
    \ repo | one Bounded Context | one or more | `/Orders/DomainCore/`, `/Orders/Presentation/`\
    \ |\n| mono-system repository | the system represented by the repository | normally\
    \ one | `/Commerce/DomainCore/`, `/Commerce/Presentation/` |\n\nThis mapping gives\
    \ both profiles the same development navigation:\n\n- `DomainCore` groups Domain,\
    \ Application, and Infrastructure projects that\n  realize the workload's business\
    \ capability;\n- `Presentation` groups runtime inbound adapters such as Web API,\
    \ gRPC, worker,\n  and MQ Consumer projects;\n- tests, analyzers/tooling, BuildingBlocks,\
    \ Shared Kernel, Published Language,\n  and CrossCutting projects may remain explicit\
    \ top-level capability groups;\n- a target may retain a flat physical `src/` layout\
    \ while using the logical\n  `.slnx` grammar.\n\nDo not create artificial Bounded\
    \ Context folders in a mono-system repository\nonly to imitate a micro-system\
    \ repo. Conversely, do not collapse real Bounded\nContexts in a micro-system mono\
    \ repo into one layer-first solution view.\n"
  normative_statement_digest: 128cc7e3a4315baa4ac69fbc944e11297eaaedef745de742350ebe522130f69c
  disposition_record:
