  catalog_normative_statement_digest: efc4cbc1e80c87926adf01295b444eec42895db9f2b0789ef18c6a9a7c2964c0
  effective_disposition: baseline-effective
  normative_statement: "## Selection Record\n\nTarget selections belong in generated\
    \ `.dev/project-config.yaml` under\n`technologySelections`. Every record uses\
    \ the schema in\n`.ai/assets/skills/ai-context-init/templates/technology-selection.schema.yaml`.\n\
    \n```yaml\ntechnologySelections:\n  - slot: testing.mocking\n    value: Moq\n\
    \    status: selected\n    source: explicit-target-decision\n    evidence:\n \
    \     - .dev/requirement/TECH-STACK-REQUIREMENTS.MD\n    reason: Existing product\
    \ test stack\n```\n\nRequired semantics:\n\n- `slot` is a stable dotted capability\
    \ name, not a package-specific field;\n- `value` is the target selection;\n- `status`\
    \ is `selected`, `not-applicable`, or `unresolved`;\n- `source` is `repository-evidence`\
    \ or `explicit-target-decision`;\n- `evidence` contains repository-relative paths\
    \ supporting the selection;\n- `reason` explains an explicit override or unresolved\
    \ decision.\n\nAn absent slot does not invent target truth. If the framework registers\
    \ a\nprofile default for that slot, the default applies until target evidence\
    \ records\nanother selection. A target override changes the selected technology,\
    \ not the\narchitecture invariants surrounding it.\n\nRecommended stable slots\
    \ include:\n\n- `testing.mocking`\n- `testing.bdd-runner`\n- `persistence.orm`\n\
    - `persistence.database`\n- `messaging.broker`\n- `messaging.framework`\n- `observability.runtime`\n\
    \nNew slots must reuse this record shape.\n"
