- rule_id: MAP-EVENTS-001
  catalog_id: selected-profile
  catalog_selector:
    rule_id: MAP-EVENTS-001
  catalog_normative_statement_digest: 1a3c010a5f2e863bcf60c7ddc333a23c7d96705e8c758bb4a89fa9cae111c01c
  effective_disposition: baseline-effective
  normative_statement: '### Pending Domain Events After Reconstruction


    An aggregate returned by `ToDomain()` MUST have no pending `DomainEvents`. Rehydration
    restores historical or persisted state; it does not represent a new business decision
    and MUST NOT cause those events to be published or persisted again.


    - A rehydration constructor SHOULD replay historical events through `When(...)`
    or an equivalent state-transition path that does not enqueue them as new events.

    - `ClearDomainEvents()` is not unconditionally required when the aggregate API
    explicitly guarantees that reconstruction leaves the pending-event collection
    empty.

    - If the selected constructor or replay path emits or enqueues events, or its
    cleanliness contract is not explicit, the mapper MUST call `ClearDomainEvents()`
    before returning the aggregate.

    - State-based fallback reconstruction follows the same rule; constructor side
    effects must not escape as pending events.


    ---

    '
  normative_statement_digest: 1a3c010a5f2e863bcf60c7ddc333a23c7d96705e8c758bb4a89fa9cae111c01c
  disposition_record:
    rule_id: MAP-EVENTS-001
    effective_disposition: baseline-effective
    applicability: Order reconstruction replays persisted events without creating
      pending events, and tests verify clean rehydration behavior.
    evidence: &id008
