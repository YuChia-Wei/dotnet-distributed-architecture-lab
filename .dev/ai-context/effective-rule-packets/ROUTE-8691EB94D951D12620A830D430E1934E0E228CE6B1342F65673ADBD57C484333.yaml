- rule_id: TEST-BDDFY-001
  catalog_id: selected-profile
  catalog_selector:
    rule_id: TEST-BDDFY-001
  catalog_normative_statement_digest: f74384cd191b1efab60eadba7e3703eff38c03d76bf6cdbb6fa388e1cc9e5693
  effective_disposition: baseline-effective
  normative_statement: "### 3. Use GWT; Default to BDDfy\n\n**Mandatory**: All tests\
    \ must use Given-When-Then semantics and recognizable step names. Arrange-Act-Assert\
    \ (3A) must not replace GWT. Use Case and integration tests default to BDDfy;\
    \ plain xUnit may implement the same GWT structure only when the target team explicitly\
    \ opts out of that package.\n\n`.feature` files and runners are not minimum dependencies.\
    \ When requirements directly provide a `.feature` file, its design or production\
    \ is explicitly requested, or the target profile has adopted a runner, create\
    \ or maintain it according to the [Gherkin Feature Storage Guide](../../../../../../.dev/specs/tests/GHERKIN-FEATURE-STORAGE-GUIDE.MD).\
    \ Otherwise, express the scenario directly as a GWT-style C# test.\n\n```csharp\n\
    // ✅ Correct: BDDfy + Gherkin style\npublic class CreateProductUseCaseTests\n\
    {\n    private CreateProductInput _input = null!;\n    private CreateProductOutput\
    \ _output = null!;\n    private readonly IAggregateRepository<Product, ProductId>\
    \ _repository;\n    private readonly CreateProductUseCase _useCase;\n\n    public\
    \ CreateProductUseCaseTests()\n    {\n        _repository = Substitute.For<IAggregateRepository<Product,\
    \ ProductId>>();\n        var unitOfWork = Substitute.For<IUnitOfWork>();\n  \
    \      var publisher = Substitute.For<IProductEventPublisher>();\n        _useCase\
    \ = new CreateProductUseCase(_repository, unitOfWork, publisher);\n    }\n\n \
    \   [Fact]\n    public void Should_create_product_successfully_when_input_is_valid()\n\
    \    {\n        this.Given(x => x.GivenAValidProductCreationInput())\n       \
    \     .When(x => x.WhenTheUseCaseIsExecuted())\n            .Then(x => x.ThenTheProductShouldBeCreated())\n\
    \            .And(x => x.ThenTheOutputShouldContainTheProductId())\n         \
    \   .BDDfy();\n    }\n\n    private void GivenAValidProductCreationInput()\n \
    \   {\n        _input = new CreateProductInput(\n            Guid.NewGuid().ToString(),\n\
    \            \"Test Product\",\n            \"user-123\"\n        );\n    }\n\n\
    \    private async Task WhenTheUseCaseIsExecuted()\n    {\n        _output = await\
    \ _useCase.ExecuteAsync(_input, CancellationToken.None);\n    }\n\n    private\
    \ void ThenTheProductShouldBeCreated()\n    {\n        _repository.Received(1).SaveAsync(Arg.Any<Product>(),\
    \ Arg.Any<CancellationToken>());\n    }\n\n    private void ThenTheOutputShouldContainTheProductId()\n\
    \    {\n        _output.ProductId.Should().NotBeNull();\n    }\n}\n\n// ❌ Incorrect:\
    \ replaces the Use Case business-flow test with a delivery Command and Handler\n\
    [Fact]\npublic async Task TestCreateProduct()  // Incorrect name\n{\n    // Arrange\n\
    \    var command = new CreateProductCommand(...);\n\n    // Act\n    var result\
    \ = await _handler.Handle(command, CancellationToken.None);\n\n    // Tests only\
    \ the adapter and does not directly protect Use Case orchestration.\n}\n```\n\n\
    Handler adapter tests must remain separate and narrow: verify only Command-to-Input\
    \ mapping, exactly one\nUse Case invocation, and delivery-specific failure mapping.\
    \ A Handler test that mocks a\nRepository must not duplicate responsibility for\
    \ business-flow testing.\n\n---\n"
  normative_statement_digest: f74384cd191b1efab60eadba7e3703eff38c03d76bf6cdbb6fa388e1cc9e5693
  disposition_record:
    rule_id: TEST-BDDFY-001
    effective_disposition: baseline-effective
