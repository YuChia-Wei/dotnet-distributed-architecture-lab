- rule_id: AICTX-EVIDENCE-001
  catalog_id: shared
  catalog_selector:
    rule_id: AICTX-EVIDENCE-001
  catalog_normative_statement_digest: 659101967c605eb6e1216fa5e49767ebc8fc7ef534af293310c708c4f09980b4
  effective_disposition: baseline-effective
  normative_statement: "## Tool-Neutral Evidence Boundary\n\nRule ID: `AICTX-EVIDENCE-001`\n\
    \nOptional repository indexes, code graphs, IDE indexes, MCP servers, semantic\n\
    search, and similar tools are discovery accelerators. They may identify candidate\n\
    files, sections, or relationships, but their output is not authoritative project\n\
    truth and must not be the sole evidence for an AI-context finding, absence claim,\n\
    inventory, or relationship conclusion.\n\n- Keep AI-context skills usable when\
    \ no optional discovery tool is installed.\n- Do not require one vendor, graph\
    \ schema, hook, cache, or persisted index.\n- Verify material findings against\
    \ direct repository files, Git-tracked paths,\n  structured manifests, or repository-owned\
    \ deterministic validators.\n- Treat an empty search result as unknown until the\
    \ declared scope is checked by\n  a tool-independent fallback.\n- Record tool\
    \ name, index freshness, scope, exclusions, and skipped checks when\n  tool output\
    \ materially accelerated an assessment.\n- Prefer the narrowest direct verification\
    \ needed for a candidate finding; an\n  accelerator may choose where to look,\
    \ but it may not decide what is true.\n\n### Quick Fallback Verification\n\nUse\
    \ these repository-native checks before accepting a discovery-tool conclusion:\n\
    \n| Risk | Fast verification |\n| --- | --- |\n| Hidden or skipped AI-context\
    \ roots | Run `git ls-files -- .ai .dev .agents .claude .codex .github AGENTS.md\
    \ CLAUDE.md AGENTS.zh-TW.md README.md README.en.md`, then inspect `git status\
    \ --short --untracked-files=all` for untracked context. |\n| Incomplete Markdown\
    \ inventory | Run `git ls-files -- '*.md'` and compare the relevant paths with\
    \ the tool result. |\n| Missing Markdown relationship | Search the literal target\
    \ or link text with `git grep -n -F -- '<target-or-link-text>' -- '*.md'`, open\
    \ the source file, and resolve the target relative to that file. |\n| Stale index\
    \ or snapshot | Compare the tool's recorded revision, when available, with `git\
    \ rev-parse HEAD`; directly reopen every file used by a material finding. |\n\
    | Tool-specific omissions | Run `python .ai/scripts/validate-ai-context.py` for\
    \ registered context contracts and record any relationship class the validator\
    \ does not cover. |\n\nThe 2026-07-13 Codebase Memory MCP probe is an example,\
    \ not a permanent\nproduct contract: its full index omitted `.claude/` and exposed\
    \ Markdown files\nand headings without Markdown link edges. Re-test current tool\
    \ behavior when it\nmatters, and use the fallback checks above regardless of tool\
    \ brand.\n\n### Generated Inventory Contract\n\nA generated inventory, index,\
    \ graph export, or snapshot that is retained as a\nrepository artifact must identify\
    \ its generator, generation time, source Git\nrevision or input digest, scope,\
    \ and exclusions. It must also state how a user\ncan reproduce or validate it.\
    \ If those fields are absent or its source revision\ndiffers from the subject\
    \ revision, treat it as a discovery hint rather than\nprimary evidence.\n\n- Do\
    \ not overwrite human-owned or file-backed truth with a generated view.\n- Do\
    \ not infer completeness from a generated artifact merely because it is committed.\n\
    - Prefer a repository-owned deterministic regeneration or parity check when the\
    \ generated artifact is an active catalog.\n- When no active generated inventory\
    \ exists, record the check as not applicable instead of creating one solely for\
    \ convenience.\n"
  normative_statement_digest: 659101967c605eb6e1216fa5e49767ebc8fc7ef534af293310c708c4f09980b4
  disposition_record:
    rule_id: AICTX-EVIDENCE-001
    effective_disposition: baseline-effective
    applicability: AI-context initialization, upgrade, audit, and development must
