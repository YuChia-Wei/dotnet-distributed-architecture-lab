- rule_id: DELETE-SOFT-001
  catalog_id: selected-profile
  catalog_selector:
    rule_id: DELETE-SOFT-001
  catalog_normative_statement_digest: 5e5370bef9fae1d46a6df8518ab380422368a25d7bb0ca00affc1af3f726cfa7
  effective_disposition: baseline-effective
  normative_statement: "### 0. Soft-Delete Default Profile\n\nRule ID: `DELETE-SOFT-001`\
    \ (`profile-default`).\n\nThe dotnet-backend Aggregate Repository profile defaults\
    \ to soft deletion.\nAffected Aggregates support the following field and event-application\
    \ behavior,\nand deletion is persisted through `SaveAsync`.\n\nA target may explicitly\
    \ opt out for an Aggregate or repository profile when its\nrequirements or architecture\
    \ decision select another lifecycle. The opt-out\nmust be recorded in target evidence\
    \ such as `.dev/project-config.yaml`\narchitecture capability selections, requirements,\
    \ or an ADR. An opted-out\nAggregate is not required to add `IsDeleted`.\n\n####\
    \ Adopted Aggregate Root Must Have an `IsDeleted` Field and Handling Logic\n\n\
    ```csharp\n// ✅ Correct when soft deletion is adopted\npublic class WorkItem :\
    \ EsAggregateRoot<WorkItemId>\n{\n    public bool IsDeleted { get; private set;\
    \ }  // Required soft-delete marker\n\n    // Set IsDeleted = true when handling\
    \ the deletion event\n    protected override void When(IDomainEvent @event)\n\
    \    {\n        switch (@event)\n        {\n            case WorkItemDeleted e:\n\
    \                IsDeleted = true;  // Mark as deleted\n                break;\n\
    \            // Other event handling...\n        }\n    }\n}\n```\n\n---\n"
  normative_statement_digest: 5e5370bef9fae1d46a6df8518ab380422368a25d7bb0ca00affc1af3f726cfa7
  disposition_record:
    rule_id: DELETE-SOFT-001
    effective_disposition: baseline-effective
    applicability: Products persists an isdeleted marker and filters deleted records
      from aggregate and query repositories.
    evidence: &id007
