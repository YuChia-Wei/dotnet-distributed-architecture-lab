- rule_id: DELETE-PURGE-001
  catalog_id: selected-profile
  catalog_selector:
    rule_id: DELETE-PURGE-001
  catalog_normative_statement_digest: 7d8e43950811aa96c6cfc12f811deb9c8d13739989d4611176e5d0e4754c165e
  effective_disposition: baseline-effective
  normative_statement: '## 📌 Core Concept


    An **Archive** is a database write pattern dedicated to Query Models in a CQRS
    architecture:


    - Its interface resembles a Write Model Repository, but an Archive handles database
    write requirements for a Query Model.

    - A Repository is limited to writing a single Aggregate in the Command Model.

    - It may write to one table or across multiple tables.

    - A Reactor in the Handler layer invokes the Archive after receiving a Domain
    Event and writes the data to the database.


    ---

    '
  normative_statement_digest: 7d8e43950811aa96c6cfc12f811deb9c8d13739989d4611176e5d0e4754c165e
  disposition_record:
