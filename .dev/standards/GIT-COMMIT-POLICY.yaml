schema_version: "1.3"
allowed_types:
  - docs
  - workflow
  - feat
  - fix
  - refactor
  - test
  - chore
  - merge
# Use exactly one title discriminator: one-or-more issue references or one
# boundary scope. A literal pipe was historical documentation meta-notation for
# "or"; it is not part of the prospective commit-title grammar.
subject_pattern: '^(docs|workflow|feat|fix|refactor|test|chore|merge)\((?:#[0-9]+(?:,#[0-9]+)*|[a-z0-9][a-z0-9-]*)\): .+$'
subject_pattern_effective_at: '2026-08-10T00:40:00+08:00'
legacy_subject_pattern: '^(docs|workflow|feat|fix|refactor|test|chore|merge)\((?:#[0-9]+(?:,#[0-9]+)*\|)?[a-z0-9][a-z0-9-]*\): .+$'
legacy_subject_pattern_status: 'deprecated-compatibility-only-before-subject_pattern_effective_at'
# Initialized targets may adopt this policy prospectively through their validated
# provenance. The target record binds this identifier and the raw SHA-256 of
# these incoming policy bytes; its legacy-history tip, never its timestamp,
# selects the deprecated grammar for pre-adoption reachable commits.
subject_grammar_policy_id: 'git-commit-subject/v2'
workflow:
  required_sections:
    - Why
    - What
    - Validation
    - Workflow
  require_identity_match: true
# A positive delimiter avoids partial matches before Unicode combining marks.
assessment:
  subject_id_pattern: '\bASM-[0-9]{8}-(?:(?:[01][0-9]|2[0-3])-[a-z0-9]{3}|[0-9]{3})(?=$|[\s\]\[(){}<>`.,;:!?/#"\x27\uFF0C\u3002\uFF1B\uFF1A\uFF01\uFF1F\u3001\uFF08\uFF09\u3010\u3011\u300A\u300B\u300C\u300D\u300E\u300F])'
  trailer: Assessment-Id
ai_signature:
  trailer: Co-Authored-By
  effective_at: '2026-07-27T09:52:09+08:00'
  value_pattern: '^(?P<runtime>.+) \((?P<model>[^,()]+), (?P<reasoning_effort>[^()]+)\) <noreply@[^ >]+>$'
  legacy_value_pattern: '^.+ <noreply@[^ >]+>$'
  additional_trailer_runtime_suffix: ' Sub-Agent'
  require_all_trailers_match: true
  final_non_empty_line: true
