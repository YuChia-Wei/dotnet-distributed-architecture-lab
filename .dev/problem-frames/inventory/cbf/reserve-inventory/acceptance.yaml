scenarios:
  - id: SC1
    title: "Reserve sufficient stock once"
    given:
      - "A valid operation identifies a product with sufficient stock."
    when:
      - "IReserveInventoryUseCase.ExecuteAsync is invoked."
    then:
      - "Stock is decremented by the requested quantity exactly once."
      - "A durable successful outcome records remaining stock."
      - "ProductStockDecreasedIntegrationEvent is staged in the same transaction with stable message and partition identities."
    traces_to: { requirements: ["INV-005", "INV-006", "INT-003"], frame_concerns: ["FC1", "FC2", "FC3", "FC4"] }
    tests_anchor: "tests/InventoryControl.Tests/ReserveInventoryUseCaseTests.cs#given_sufficient_stock_when_reserving_then_state_and_outbox_commit_with_stable_delivery_identity"
  - id: SC2
    title: "Replay matching successful operation"
    given:
      - "The operation already completed successfully for the same product and quantity."
    when:
      - "The same request is replayed."
    then:
      - "The stored success is returned with WasAlreadyProcessed true."
      - "Stock is not decremented again."
      - "No second outbox row is added and delivery identity remains stable."
    traces_to: { requirements: ["INV-006", "INT-003"], frame_concerns: ["FC2", "FC4"] }
    tests_anchor: "tests/InventoryControl.Tests/ReserveInventoryUseCaseTests.cs#given_a_successful_replay_when_committed_then_stock_and_outbox_are_not_duplicated"
  - id: SC3
    title: "Reject conflicting payload for operation identity"
    given:
      - "The operation id is already bound to another product or quantity."
    when:
      - "The conflicting request is processed."
    then:
      - "OperationIdentityConflict is returned with WasAlreadyProcessed true."
      - "Stock is unchanged."
      - "No new successful reservation event is staged."
    traces_to: { requirements: ["INV-006"], frame_concerns: ["FC2", "FC5"] }
    tests_anchor: "tests/InventoryControl.Tests/ReserveInventoryUseCaseTests.cs#given_an_operation_identity_conflict_when_reserving_then_only_the_original_outbox_message_remains"
  - id: SC4
    title: "Preserve terminal business failure"
    given:
      - "The operation completed with InventoryItemNotFound or InventoryIsNotEnough."
    when:
      - "Stock later changes and the request is replayed."
    then:
      - "The original failure is returned with WasAlreadyProcessed true."
      - "Stock is not re-evaluated or decremented."
    traces_to: { requirements: ["INV-006", "INV-007"], frame_concerns: ["FC2", "FC5"] }
    tests_anchor: "tests/InventoryControl.Tests/InventoryReservationIdempotencyTests.cs#given_a_terminal_failure_when_stock_changes_then_replay_preserves_the_original_outcome"
  - id: SC5
    title: "Reject invalid request before durable work"
    given:
      - "OperationId or ProductId is empty, or Quantity is not positive."
    when:
      - "The use case is invoked."
    then:
      - "The corresponding validation failure is returned."
      - "No transaction is opened."
    traces_to: { requirements: ["INV-005"], frame_concerns: ["FC1", "FC6"] }
    tests_anchor: "tests/InventoryControl.Tests/ReserveInventoryUseCaseTests.cs#given_empty_operation_id_when_reserving_then_request_is_rejected_before_side_effects"
  - id: SC6
    title: "Cancel without mutation"
    given:
      - "Cancellation is requested before reservation work begins."
    when:
      - "Reservation is attempted."
    then:
      - "OperationCanceledException propagates."
      - "Stock and operation history remain unchanged."
    traces_to: { requirements: ["NFR-005"], frame_concerns: ["FC3", "FC6"] }
    tests_anchor: "tests/InventoryControl.Tests/InventoryReservationIdempotencyTests.cs#given_cancellation_before_reservation_when_executed_then_state_is_not_mutated"
  - id: SC7
    title: "Serialize concurrent PostgreSQL reservations and outbox insertion"
    given:
      - "PostgreSQL stock cannot satisfy two concurrent reservation requests together."
    when:
      - "Two distinct operations reserve the same product concurrently."
    then:
      - "Exactly one operation succeeds and stock never becomes negative."
      - "Both terminal outcomes are durable."
      - "Exactly one InventoryIntegrationOutbox row exists for the successful operation."
    traces_to: { requirements: ["INV-006", "INV-007"], frame_concerns: ["FC2", "FC3", "FC4"] }
    tests_anchor: "tests/InventoryControl.Tests/PostgresInventoryReservationRepositoryTests.cs#given_stock_for_only_one_request_when_two_reservations_run_concurrently_then_stock_and_outcomes_are_atomic"
  - id: SC8
    title: "Roll back when source-outbox staging fails"
    given:
      - "Reservation calculation succeeds but source-outbox staging fails before commit."
    when:
      - "IReserveInventoryUseCase.ExecuteAsync is invoked."
    then:
      - "The transaction is not committed."
      - "The failure propagates for retry or diagnosis."
    traces_to: { requirements: ["INV-006", "NFR-004"], frame_concerns: ["FC3", "FC6"] }
    tests_anchor: "tests/InventoryControl.Tests/ReserveInventoryUseCaseTests.cs#given_outbox_staging_fails_when_reserving_then_the_transaction_is_not_committed"
  - id: SC9
    title: "Retry relay with stable delivery metadata"
    given:
      - "A committed Inventory outbox row fails its first transport publication."
    when:
      - "The relay claims and publishes the same row again."
    then:
      - "MessageId, partition key, and OccurredOn remain stable across attempts."
      - "Successful relay marks the row published without creating a new logical message."
    traces_to: { requirements: ["INV-007", "INT-004"], frame_concerns: ["FC4", "FC6"] }
    tests_anchor: "tests/InventoryControl.Tests/InventoryIntegrationOutboxRelayTests.cs#given_the_same_claimed_row_when_publish_is_retried_then_delivery_identity_and_event_time_are_stable"
