aggregate: "InventoryItem"

contracts:
  preconditions:
    - { id: PRE1, rule: "The reservation operation id and product id are non-empty." }
    - { id: PRE2, rule: "The requested quantity is greater than zero." }
  postconditions:
    - { id: POST1, rule: "Successful new reservation reduces Stock by Quantity, records RemainingStock, and stages one source-outbox event in the same transaction." }
    - { id: POST2, rule: "Matching replay returns the recorded outcome with WasAlreadyProcessed true, without a second decrement, factory invocation, or outbox staging, even after published retention or when the outbox row is missing." }
    - { id: POST3, rule: "Mismatched replay returns OperationIdentityConflict and no mutation or new outbox row." }
  invariants:
    - { id: INV1, rule: "Stock is never negative." }
    - { id: INV2, rule: "One OperationId is bound to exactly one ProductId and Quantity payload." }
    - { id: INV3, rule: "A completed operation outcome is immutable." }
    - { id: INV4, rule: "First-time success atomically inserts one InventoryIntegrationOutbox row with Id equal to OperationId; published retention may later leave zero rows. The durable outcome remains, and matching replay never recreates a row." }

behavior:
  signature: "IReserveInventoryUseCase.ExecuteAsync(ReserveInventoryInput, CancellationToken) through IInventoryReservationOutbox"
  persistence_boundary: "The Application use case supplies the successful event factory to a capability-specific outbox port; PostgresInventoryReservationRepository privately controls the local transaction and atomically persists stock, operation outcome, and outbox without owning business meaning."

domain_events:
  - name: "Lab.BoundedContextContracts.Inventory.IntegrationEvents.ProductStockDecreasedIntegrationEvent"
    attributes:
      - "InventoryItemId"
      - "ProductId"
      - "DecreasedQuantity"
      - "CurrentStock"
    delivery:
      message_id: "OperationId"
      partition_key: "ProductId.ToString(\"N\")"

semantic_tags:
  - { field: "OperationId", semantics: [idempotency_key, delivery_identity] }
  - { field: "ProductId", semantics: [aggregate_lookup, partition_key] }
  - { field: "Quantity", semantics: [positive_business_quantity] }

owner_decisions:
  - "Kafka is canonical and ProductId.ToString(\"N\") is the ordering partition key for this event."
  - "The producer Inventory context owns ProductStockDecreasedIntegrationEvent meaning and schema."
  - "Missing or legacy outbox row recovery is a separate explicitly scoped repair after inspecting outcome and delivery evidence; ordinary reservation replay never recreates it."
